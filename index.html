<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="3B Quest">
<meta name="theme-color" content="#3B5BDB">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>[hidden]{display:none!important}html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}</style>
<title>3B Big Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: one phone-first column (max 560px), big tap targets; the home page is four chapters (past, practice, strengths, now) plus studios; each quest world tints the play screen through --world */
:root{
  --bg:#EEF4FB; --surface:#FFFFFF; --ink:#172033; --muted:#5D6B80; --line:#D3DEEC; --soft:#E6ECFB;
  --accent:#3B5BDB; --accent-ink:#FFFFFF;
  --sun:#FFB800; --good:#1FA971; --good-soft:#DDF5EA; --bad:#E5484D; --bad-soft:#FDE3E4;
  --w-forces:#12A594; --w-numbers:#3B5BDB; --w-round:#0E8FD6; --w-words:#C2419A; --w-library:#7A4FD8; --w-trip:#F5820D; --w-music:#D6336C; --w-mix:#D99A00;
  --w-units:#2B8A3E; --w-sentences:#7048E8; --w-explain:#0CA678; --w-champion:#E8590C; --w-detective:#1864AB; --w-stickers:#F03E7E; --w-anleitung:#C2255C; --w-now:#7950F2;
  --w-read:#2F855A; --w-stage:#B7410E; --w-grow:#AE3EC9;
  --world:var(--accent);
  --display:'Fredoka',system-ui,sans-serif; --body:'Nunito',system-ui,sans-serif;
  --shadow:0 5px 0 rgba(23,32,51,.10);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1626; --surface:#1A2338; --ink:#EEF3FA; --muted:#9DA9BE; --line:#2B3752; --soft:#22305A;
    --accent:#7B93FF; --accent-ink:#0F1626;
    --sun:#FFC533; --good:#34D399; --good-soft:#143A2E; --bad:#FF6B70; --bad-soft:#4A2126;
    --w-forces:#2AD1BF; --w-numbers:#7B93FF; --w-round:#4FB3F0; --w-words:#F06BC8; --w-library:#A98BFF; --w-trip:#FFA24C; --w-music:#FF6B9E; --w-mix:#F2C14E;
    --w-units:#51CF66; --w-sentences:#9775FA; --w-explain:#38D9A9; --w-champion:#FF922B; --w-detective:#4DABF7; --w-stickers:#FF6BA5; --w-anleitung:#F06595; --w-now:#B197FC;
    --w-read:#5BC98A; --w-stage:#F0813F; --w-grow:#DA77F2;
    --shadow:0 5px 0 rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1626; --surface:#1A2338; --ink:#EEF3FA; --muted:#9DA9BE; --line:#2B3752; --soft:#22305A;
  --accent:#7B93FF; --accent-ink:#0F1626;
  --sun:#FFC533; --good:#34D399; --good-soft:#143A2E; --bad:#FF6B70; --bad-soft:#4A2126;
  --w-forces:#2AD1BF; --w-numbers:#7B93FF; --w-round:#4FB3F0; --w-words:#F06BC8; --w-library:#A98BFF; --w-trip:#FFA24C; --w-music:#FF6B9E; --w-mix:#F2C14E;
  --w-units:#51CF66; --w-sentences:#9775FA; --w-explain:#38D9A9; --w-champion:#FF922B; --w-detective:#4DABF7; --w-stickers:#FF6BA5; --w-anleitung:#F06595; --w-now:#B197FC;
  --w-read:#5BC98A; --w-stage:#F0813F; --w-grow:#DA77F2;
  --shadow:0 5px 0 rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
#app{max-width:560px;margin:0 auto;padding-block:20px 48px;padding-inline:16px;min-height:100%}
.screen{display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:2.4rem}
h2{font-size:1.35rem}
h3{font-size:1.1rem}
p{margin:0}
.eyebrow{font-family:var(--display);font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.center{display:flex;justify-content:center}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:10px 18px;border-radius:16px;border:2px solid var(--line);background:var(--surface);font-family:var(--display);font-size:1.1rem;font-weight:600;cursor:pointer;box-shadow:var(--shadow);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.12)}
.btn.primary{background:var(--world);border-color:var(--world);color:#fff}
.btn.ghost{box-shadow:none;background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.btn.small{min-height:40px;padding:6px 12px;font-size:.95rem;border-radius:12px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > .btn{flex:1 1 140px}

/* home */
.hero{display:flex;flex-direction:column;gap:8px}
.tagline{font-size:1.05rem;color:var(--muted);max-width:36ch}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-family:var(--display);font-weight:600}
.field input{font:inherit;font-size:1.1rem;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stat .big{font-family:var(--display);font-size:1.7rem;font-weight:600;display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.stat .big svg{width:26px;height:26px;fill:var(--sun)}
.chapter{display:flex;flex-direction:column;gap:10px;padding-top:6px;border-top:3px solid var(--line)}
.chapter .head{display:flex;flex-direction:column;gap:2px}
.chapter .head h2{font-size:1.45rem}
.chapter .head p{color:var(--muted);font-size:.95rem}
.worlds{display:flex;flex-direction:column;gap:12px}
.world{display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:14px;text-align:left;width:100%;padding:14px 16px;border-radius:20px;border:2px solid var(--line);background:var(--surface);cursor:pointer;box-shadow:var(--shadow);transition:transform .08s,box-shadow .08s}
.world:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.12)}
.world .icon{width:56px;height:56px;border-radius:18px;background:var(--c);color:#fff;display:grid;place-items:center}
.world .icon svg{width:32px;height:32px}
.world .name{font-family:var(--display);font-size:1.2rem;font-weight:600}
.world .sub{color:var(--muted);font-size:.9rem}
.world .best{font-family:var(--display);font-size:.85rem;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.world .best b{display:block;font-size:1.1rem;color:var(--c)}
.mark{display:inline-flex;align-items:center;gap:4px;font-family:var(--display);font-size:.8rem;font-weight:600;background:var(--soft);border-radius:999px;padding:2px 9px;margin-top:5px;color:var(--muted)}
.mark b{color:var(--ink)}
.chapter.bad .head h2{color:var(--bad)}
.chapter.good .head h2{color:var(--good)}
.chapter.new .head h2{color:var(--w-trip)}
.chapter.old .head h2{color:var(--muted)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:.88rem}

/* play */
.topbar{display:flex;align-items:center;gap:10px}
.iconbtn{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round}
.chip{font-family:var(--display);font-weight:600;font-size:.95rem;background:var(--world);color:#fff;padding:6px 12px;border-radius:999px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
.roundstars{margin-left:auto;font-family:var(--display);font-weight:600;font-size:1.1rem;display:flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
.roundstars svg{width:22px;height:22px;fill:var(--sun)}
.dots{display:flex;gap:5px}
.dot{flex:1;height:9px;border-radius:5px;background:var(--line)}
.dot.cur{background:var(--world);opacity:.55}
.dot.good{background:var(--good)}
.dot.bad{background:var(--bad)}
.qcard{background:var(--surface);border:2px solid var(--line);border-top:7px solid var(--world);border-radius:22px;padding:20px 18px 22px;display:flex;flex-direction:column;gap:16px}
.prompt{font-size:1.3rem}
.visual{display:flex;justify-content:center}
.visual svg{max-width:100%;height:auto}
.quote{background:var(--soft);border-radius:14px;padding:14px 16px;font-size:1.1rem;line-height:1.5;width:100%;border-left:5px solid var(--world)}
.itemcard{font-family:var(--display);font-size:1.6rem;font-weight:600;background:var(--soft);border-radius:18px;padding:18px 22px;text-align:center;width:100%;border:2px dashed var(--world);font-variant-numeric:tabular-nums}
.tablewrap{width:100%;overflow-x:auto}
.dt{width:100%;border-collapse:collapse;font-size:1rem;background:var(--surface)}
.dt th,.dt td{border:2px solid var(--line);padding:8px 10px;text-align:left}
.dt th{background:var(--soft);font-family:var(--display);font-weight:600}
.dt td.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--display);font-size:1.1rem}
.answers{display:flex;flex-direction:column;gap:10px}
.answers.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.answers.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opt{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;padding:12px 16px;border-radius:16px;border:2px solid var(--line);background:var(--surface);font-family:var(--display);font-size:1.08rem;font-weight:500;text-align:left;cursor:pointer;box-shadow:var(--shadow);transition:transform .08s,box-shadow .08s;line-height:1.3}
.answers.grid .opt,.answers.grid3 .opt{justify-content:center;text-align:center;font-size:1.25rem;font-variant-numeric:tabular-nums}
.opt.vis{padding:10px}
.opt svg{width:min(100%,130px);height:auto}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.12)}
.opt:disabled{cursor:default;box-shadow:none;opacity:.55}
.opt.correct{border-color:var(--good);background:var(--good-soft);opacity:1}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);opacity:1}
.feedback{border-radius:14px;padding:12px 14px;font-weight:600;line-height:1.45;border-left:6px solid}
.feedback.good{background:var(--good-soft);border-color:var(--good)}
.feedback.bad{background:var(--bad-soft);border-color:var(--bad)}
.feedback ol{margin:6px 0 0;padding-left:22px;font-weight:400}
#nextBtn{scroll-margin-bottom:20px}
.feedback .mark{font-family:var(--display);font-size:1.15rem;display:block;margin-bottom:2px}

/* typed answers */
.column{display:inline-grid;grid-template-columns:2rem repeat(3,2.4rem);font-family:var(--display);font-size:2.1rem;font-weight:600;font-variant-numeric:tabular-nums;text-align:center;line-height:1.3;margin:0 auto}
.column .u{border-bottom:4px solid var(--ink)}
.column .op{color:var(--world)}
.typed{font-family:var(--display);font-size:2.2rem;font-weight:600;min-height:66px;border:3px dashed var(--line);border-radius:16px;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;letter-spacing:.06em;color:var(--ink)}
.typed:empty::before{content:'?';color:var(--muted);opacity:.5}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key{min-height:54px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-family:var(--display);font-size:1.35rem;font-weight:600;cursor:pointer;box-shadow:var(--shadow)}
.key:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.12)}
.key.go{background:var(--world);border-color:var(--world);color:#fff}
.key:disabled{opacity:.5;cursor:default}

/* ordering */
.slots{display:flex;flex-wrap:wrap;gap:6px}
.slot{font-family:var(--display);font-size:.85rem;font-weight:600;background:var(--soft);border-radius:999px;padding:4px 10px;display:inline-flex;gap:6px;align-items:center}
.slot i{font-style:normal;color:var(--world)}
.ord{justify-content:flex-start}
.badge{width:32px;height:32px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-family:var(--display);font-weight:600;flex:none;color:var(--muted)}
.ord.picked .badge{background:var(--world);color:#fff}
.ord.picked{border-color:var(--world)}
.ord.correct .badge{background:var(--good);color:#fff}
.ord.wrong .badge{background:var(--bad);color:#fff}

/* results */
.results{align-items:center;text-align:center}
.bigstars{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.bigstars svg{width:40px;height:40px;fill:var(--line)}
.bigstars svg.on{fill:var(--sun)}
.score{font-family:var(--display);font-size:3.2rem;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:1.3rem;color:var(--muted)}
.resultcard{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:24px 20px;display:flex;flex-direction:column;gap:14px;align-items:center;width:100%}

/* studios */
.studio{background:var(--surface);border:2px solid var(--line);border-top:7px solid var(--world);border-radius:22px;padding:20px 18px 22px;display:flex;flex-direction:column;gap:16px}
.checks{display:flex;flex-direction:column;gap:8px}
.chk{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);text-align:left;cursor:pointer;font-size:1.02rem;line-height:1.35}
.chk .box{width:28px;height:28px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;flex:none;background:var(--surface)}
.chk .box svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.chk.on{border-color:var(--world);background:var(--soft)}
.chk.on .box{background:var(--world);border-color:var(--world)}
.chk.on .box svg{opacity:1}
.chk.on span.t{text-decoration:line-through;color:var(--muted)}
.timer{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--soft);border-radius:16px;padding:12px 14px}
.timer .clock{font-family:var(--display);font-size:2.2rem;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.twister{background:var(--soft);border-radius:14px;padding:12px 16px;font-family:var(--display);font-size:1.15rem;line-height:1.45;border-left:5px solid var(--world)}
.tips{margin:0;padding-left:20px;color:var(--muted)}
.tips li{margin-bottom:4px}
.progress{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--world);width:0;transition:width .3s}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:9}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:380px){h1{font-size:2rem}.prompt{font-size:1.18rem}.chip{max-width:50%}.answers.grid3{grid-template-columns:1fr 1fr}}
</style>

</head>
<body>
<div id="app">
  <!-- HOME -->
  <section id="home" class="screen">
    <div class="hero">
      <div class="eyebrow">Grade 3B · Bavarian International School</div>
      <h1>3B Big Quest</h1>
      <p class="tagline">8 questions per quest. Collect stars!</p>
    </div>
    <div class="field">
      <label for="playerName">What is your name, explorer?</label>
      <input id="playerName" type="text" maxlength="20" placeholder="Type your name" autocomplete="off">
    </div>
    <div class="stats">
      <div class="stat"><span class="eyebrow">Stars collected</span><span class="big"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.7 7.1L12 17.3 5.7 21l1.7-7.1L2 9.2l7.1-.6z"/></svg><span id="totalStars">0</span></span></div>
      <div class="stat"><span class="eyebrow">Your rank</span><span class="big" id="rank">Explorer</span></div>
    </div>
    <div id="chapters"></div>
    <div class="foot">
      <span>Marks and tasks from Toddle, updated 28 October.</span>
      <button class="btn small" id="soundBtn" type="button">Sound: on</button>
    </div>
  </section>

  <!-- PLAY -->
  <section id="play" class="screen" hidden>
    <div class="topbar">
      <button class="iconbtn" id="quitBtn" type="button" aria-label="Back to home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <span class="chip" id="worldChip">Forces Lab</span>
      <span class="roundstars"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.7 7.1L12 17.3 5.7 21l1.7-7.1L2 9.2l7.1-.6z"/></svg><span id="roundStars">0</span></span>
    </div>
    <div class="dots" id="dots" aria-hidden="true"></div>
    <div class="qcard">
      <div class="eyebrow" id="qLabel"></div>
      <h2 class="prompt" id="qPrompt"></h2>
      <div class="visual" id="qVisual" hidden></div>
      <div id="qAnswers" class="answers"></div>
      <div id="feedback" class="feedback" hidden aria-live="polite"></div>
      <button class="btn primary" id="nextBtn" type="button" hidden>Next</button>
    </div>
  </section>

  <!-- RESULTS -->
  <section id="results" class="screen results" hidden>
    <div class="eyebrow" id="resWorld">Forces Lab</div>
    <div class="resultcard">
      <div class="bigstars" id="bigStars"></div>
      <div class="score"><span id="resScore">0</span><small> / 8</small></div>
      <h2 id="resHead">Great job!</h2>
      <p class="muted" id="resMsg"></p>
    </div>
    <div class="row" style="width:100%">
      <button class="btn primary" id="againBtn" type="button">Play again</button>
      <button class="btn" id="homeBtn" type="button">Choose a quest</button>
    </div>
  </section>

  <!-- STUDIO -->
  <section id="studioScreen" class="screen" hidden>
    <div class="topbar">
      <button class="iconbtn" id="studioBack" type="button" aria-label="Back to home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <span class="chip" id="studioChip">Studio</span>
    </div>
    <div class="studio" id="studioBody"></div>
  </section>
</div>
<canvas id="confetti" aria-hidden="true"></canvas>

<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
const rnd = n => Math.floor(Math.random()*n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=rnd(i+1); const t=b[i]; b[i]=b[j]; b[j]=t; } return b; };
const uniq = a => a.filter((v,i)=>a.indexOf(v)===i);
const pad = n => String(n).padStart(2,'0');
const fmt = n => Number(n).toLocaleString('en-GB');
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const round10 = n => Math.round(n/10)*10, round100 = n => Math.round(n/100)*100;
const STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.7 7.1L12 17.3 5.7 21l1.7-7.1L2 9.2l7.1-.6z"/></svg>';
const TICK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

const store = {
  get(k,d){ try{ const v=localStorage.getItem('bq2_'+k); return v===null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem('bq2_'+k, JSON.stringify(v)); }catch(e){} }
};

/* ---------- sound ---------- */
let muted = store.get('muted', false);
let ac = null;
function beep(kind){
  if(muted) return;
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(), g=ac.createGain(); o.connect(g); g.connect(ac.destination);
    const t=ac.currentTime; o.type='triangle';
    if(kind==='good'){ o.frequency.setValueAtTime(523,t); o.frequency.setValueAtTime(659,t+.09); o.frequency.setValueAtTime(784,t+.18); }

function mc(prompt, right, wrongs, explain, extra){
  wrongs=uniq(wrongs).filter(t=>t!==right);

  return Object.assign({kind:'mc', prompt:prompt, options:opts.map(o=>o.t), answer:opts.findIndex(o=>o.ok), explain:explain, visual:''}, extra||{});
}
function two(prompt, options, answerIdx, explain, extra){

function fill3(right, cands){
  let w=uniq(cands).filter(x=>x!==right && x>0);

  let k=1; while(w.length<3){ const c=right+(k%2?k:-k)*(right>=1000?100:1); if(c>0 && w.indexOf(c)<0) w.push(c); k++; }
  return w;
}
function orderQ(prompt, items, slots, explain, extra){

}

const NW={5:'five',10:'ten',20:'twenty',25:'twenty-five'};
function timeWords(h,m){

  if(m===30) return "half past "+h;
  if(m===45) return "quarter to "+nh;

  const seen={}; seen[key(h,m)]=1; const wrongs=[];

const RND={label:'Rounding Road', world:'round'};
function randNotMid(){ let n; do { n=101+rnd(799); } while(n%100===0 || n%100===50); return n; }
function nearestHundredQ(tag){
  const n=randNotMid(), lo=Math.floor(n/100)*100, hi=lo+100, near=(n-lo<50)?lo:hi;
  return two("Which hundred is <b>closest</b> to <b>"+n+"</b>?", [String(lo),String(hi)], near===lo?0:1,
    n+" sits between "+lo+" and "+hi+". It is "+(n-lo)+" away from "+lo+" and "+(hi-n)+" away from "+hi+", so the nearest hundred is "+near+".",
    Object.assign({visual:benchLineSVG(n,lo,hi)}, tag||RND));
}
function benchmarkQ(){
  const n=randNotMid(), lo=Math.floor(n/100)*100, hi=lo+100, less=rnd(2)===0;
  const right=less?lo:hi;
  const wrongs=fill3(right,[less?hi:lo, lo-100, hi+100, round10(n)]);
  return mc("Which benchmark hundred is just <b>"+(less?"less than":"greater than")+"</b> <b>"+n+"</b>?", String(right), wrongs.map(String),
    "The hundreds around "+n+" are "+lo+" (less) and "+hi+" (greater).", Object.assign({grid:true}, RND));
}
function roundWordQ(){
  const n=randNotMid(), lo=Math.floor(n/100)*100, hi=lo+100, near=(n-lo<50)?lo:hi;
  const wrongs=fill3(near,[near===lo?hi:lo, round10(n), near+100, near-100]);
  return mc("Round <b>"+n+"</b> to the nearest hundred.", String(near), wrongs.map(String),
    "Look at the tens digit ("+Math.floor((n%100)/10)+"). 0 to 4 rounds down to "+lo+", 5 to 9 rounds up to "+hi+". So "+n+" rounds to "+near+".", Object.assign({grid:true}, RND));
}
function addendsQ(){
  const target=pick([100,100,200,500,500,1000,300]);
  const a=10*(1+rnd(target/10-1)), b=target-a;
  const right=a+" + "+b;
  const bad=[[a+10,b],[a,b+10],[a-10,b],[a+100,b],[a+1,b],[a,b-1]].filter(p=>p[0]>0&&p[1]>0).map(p=>p[0]+" + "+p[1]);
  return mc("Which two addends make <b>"+fmt(target)+"</b>?", right, shuffle(uniq(bad).filter(x=>x!==right)).slice(0,3),
    a+" + "+b+" = "+target+". Addends are the numbers you add together.", Object.assign({grid:true}, RND));
}
function estimateQ(){
  const a=randNotMid(), b=randNotMid();
  const ra=round100(a), rb=round100(b), right=ra+rb;
  const wrongs=fill3(right,[right+100,right-100,ra+rb+200,right-200,round10(a+b)]);
  return mc("Round each number to the nearest hundred, then add. About how much is <b>"+a+" + "+b+"</b>?", fmt(right), wrongs.map(fmt),
    a+" is about "+ra+" and "+b+" is about "+rb+". "+ra+" + "+rb+" = "+fmt(right)+". The exact answer is "+fmt(a+b)+", so the estimate is close!", Object.assign({grid:true}, RND));
}
function threeAddendsQ(){
  const nums=[randNotMid(),randNotMid(),randNotMid()];
  const rounded=nums.map(round100), right=rounded.reduce((p,c)=>p+c,0);
  const wrongs=fill3(right,[right+100,right-100,right+200,right-200]);

    rounded.join(" + ")+" = "+fmt(right)+". Rounding first makes big sums quick to estimate.", Object.assign({grid:true}, RND));
}

function retag(qs, tag){ return qs.map(q=>Object.assign(q, tag)); }
const SURF=['Wood','Tiles','Carpet','Sandpaper','Grass','Foil'];
function unitPickQ(){
  const items=[
   ["The toy car rolled","cm",40,180,"Distances in the Friction Roll are measured in centimetres (cm). Always write the unit!"],
   ["The toy car weighs","g",60,160,"The mass of a small toy car is measured in grams (g)."],
   ["The ramp is","m",1,2,"Long things like a ramp are measured in metres (m)."],
   ["The classroom door is about","m",2,2,"Tall things are measured in metres (m)."],
   ["A pencil is about","cm",12,19,"Short lengths are measured in centimetres (cm)."],
   ["A bag of flour weighs","kg",1,2,"Heavy things are measured in kilograms (kg)."],
   ["The water bottle holds","ml",300,750,"Liquids are measured in millilitres (ml) or litres (l)."]
  ];
  const r=pick(items), n=r[2]+rnd(r[3]-r[2]+1);
  return mc(r[0]+" <b>"+n+" ___</b>. Which unit is right?", r[1], shuffle(['cm','m','g','kg','ml','l'].filter(u=>u!==r[1])).slice(0,3), r[4], Object.assign({grid:true}, UNT));
}
function convertQ(){
  const v=rnd(4);
  if(v===0) return mc("How many centimetres are in <b>1 metre</b>?","100",["10","1,000","50"],"1 m = 100 cm. The metre stick has 100 little centimetre marks.",Object.assign({grid:true},UNT));
  if(v===1){ const m=2+rnd(4); return mc("<b>"+m+" m</b> = how many cm?", String(m*100), fill3(m*100,[m*10,m*1000,m*100+10,m*100-10]).map(String), m+" m = "+m+" × 100 cm = "+(m*100)+" cm.", Object.assign({grid:true},UNT)); }
  if(v===2){
    let cm=105+5*rnd(38); if(cm%100===0) cm+=5;
    const m=Math.floor(cm/100), r=cm%100, right=m+" m "+r+" cm";
    const wrongs=uniq([m+" m "+(r+10)+" cm",(m+1)+" m "+r+" cm", m+" m "+(100-r)+" cm", (m+1)+" m "+(r+5)+" cm"]).filter(x=>x!==right).slice(0,3);
    return mc("The car rolled <b>"+cm+" cm</b>. How much is that in metres and centimetres?", right, wrongs, cm+" cm = "+m+" m and "+r+" cm, because 100 cm make 1 m.", Object.assign({grid:true},UNT));
  }
  const a=70+5*rnd(6);
  return two("Which is longer: <b>"+a+" cm</b> or <b>1 m</b>?", [a+" cm","1 m"], 1, "1 m = 100 cm, and 100 is more than "+a+".", UNT);
}
function rulerQ(){
  const mark=15+5*rnd(17);
  const wrongs=fill3(mark,[mark+5,mark-5,mark+10,mark-10,100-mark]).map(x=>x+" cm");
  return mc("The back of the car stopped at the arrow. How far did it roll?", mark+" cm", wrongs, "Read the big numbers (tens) first, then count the small 5 cm marks. The arrow is at "+mark+" cm.", Object.assign({visual:rulerSVG(mark), grid:true}, UNT));
}
function barData(){ const names=takeFrom(SURF,4); const vals=shuffle([30,45,60,75,90,105,120,135,150,165]).slice(0,4); return names.map((n,i)=>({label:n,v:vals[i]})); }
function barReadQ(){
  const d=barData(), v=rnd(3);
  const max=d.reduce((p,c)=>c.v>p.v?c:p), min=d.reduce((p,c)=>c.v<p.v?c:p);
  if(v===0) return mc("Read the graph. On which surface did the car roll the <b>farthest</b>?", max.label, d.filter(x=>x!==max).map(x=>x.label), "The tallest bar is "+max.label+" at "+max.v+" cm.", Object.assign({visual:barChartSVG(d), grid:true}, UNT));
  if(v===1) return mc("Read the graph. Which surface had the <b>most friction</b>?", min.label, d.filter(x=>x!==min).map(x=>x.label), "Most friction means the shortest distance. The shortest bar is "+min.label+" at "+min.v+" cm.", Object.assign({visual:barChartSVG(d), grid:true}, UNT));
  const t=pick(d);
  return mc("Read the graph. How far did the car roll on <b>"+t.label+"</b>?", t.v+" cm", fill3(t.v,[t.v+15,t.v-15,t.v+30,t.v-30]).map(x=>x+" cm"), "Follow the top of the "+t.label+" bar across to the scale: "+t.v+" cm.", Object.assign({visual:barChartSVG(d), grid:true}, UNT));
}
function barMissingQ(){

}
function tableConclusionQ(){

const stripP = w => w.replace(/[.,!?]/g,'');
function capitalFixQ(){
  const r=pick(SENTS), s=r[0], words=s.split(' ');
  const v1=s.charAt(0).toLowerCase()+s.slice(1);
  const v2=s.slice(0,-1);
  let v3;
  if(r[1].length){ const pn=pick(r[1]); v3=words.map((w,i)=>i>0&&stripP(w)===pn?w.toLowerCase():w).join(' '); if(v3===s) v3=null; }
  if(!v3){ const i=1+rnd(words.length-1); v3=words.map((w,k)=>k===i?w.charAt(0).toUpperCase()+w.slice(1):w).join(' '); }
  const wrongs=uniq([v1,v2,v3]).filter(x=>x!==s);
  return mc("Which sentence is written <b>correctly</b>?", s, wrongs, "Start with a capital letter, give names, places, days and months a capital letter, and end with . ? or !", SEN);
}
function properNounQ(){
  const r=pick(SENTS.filter(x=>x[1].length)), s=r[0], words=s.split(' ').map(stripP);
  const pn=pick(r[1].filter(p=>words.indexOf(p)>0)) || r[1][0];
  const others=shuffle(words.filter((w,i)=>i>0 && r[1].indexOf(w)<0 && w.length>1)).slice(0,3);
  return mc("Which word MUST have a capital letter, even in the middle of a sentence?", pn.toLowerCase(), others.map(w=>w.toLowerCase()),
    "‘"+pn+"’ is a name, place, day or title. Those always get a capital letter.", Object.assign({visual:quote(s.toLowerCase()), grid:true}, SEN));
}

const EXP={label:'Explain Your Rounding', world:'explain'};
const COM={label:'Number Combinations', world:'combos'};
function distanceExplainQ(){
  const n=randNotMid(), lo=Math.floor(n/100)*100, hi=lo+100, d1=n-lo, d2=hi-n, near=d1<d2?lo:hi, far=near===lo?hi:lo;
  const right=n+" is "+d1+" away from "+lo+" and "+d2+" away from "+hi+". "+Math.min(d1,d2)+" is smaller, so "+near+" is closer.";
  const wrongs=[n+" is "+d2+" away from "+lo+" and "+d1+" away from "+hi+", so "+far+" is closer.", near+" is closer because I like that number more.", far+" is closer because it is the bigger number."];
  return mc("Which explanation shows <b>how you know</b> which hundred is closest to "+n+"?", right, wrongs, "Explain with distances: count how far the number is from each hundred, then pick the smaller distance. The halfway point "+(lo+50)+" helps too.", Object.assign({visual:benchLineSVG(n,lo,hi)}, EXP));
}
function halfwayQ(){
  const lo=100*(1+rnd(8)), hi=lo+100;
  if(rnd(2)===0) return mc("What is the <b>halfway point</b> between "+lo+" and "+hi+"?", String(lo+50), fill3(lo+50,[lo+40,lo+60,lo+5,hi+50]).map(String), lo+" and "+hi+" are 100 apart. Half of 100 is 50, so halfway is "+(lo+50)+".", Object.assign({grid:true}, EXP));
  const n=lo+pick([10,20,30,40,60,70,80,90]);
  return two(n+" is between "+lo+" and "+hi+". The halfway point is "+(lo+50)+". So "+n+"…", ["rounds down to "+lo, "rounds up to "+hi], n<lo+50?0:1,
    n+" is "+(n<lo+50?"below":"above")+" the halfway point "+(lo+50)+", so it rounds "+(n<lo+50?"down to "+lo:"up to "+hi)+".", Object.assign({visual:benchLineSVG(n,lo,hi)}, EXP));
}
function tenVsHundredQ(){
  let a,b,tens,hund,exact;
  do { a=randNotMid(); b=randNotMid(); exact=a+b; tens=round10(a)+round10(b); hund=round100(a)+round100(b); } while(tens===hund || a%10===5 || b%10===5);
  const tensCloser=Math.abs(tens-exact)<=Math.abs(hund-exact);
  const optT="Nearest ten: "+round10(a)+" + "+round10(b)+" = "+fmt(tens), optH="Nearest hundred: "+round100(a)+" + "+round100(b)+" = "+fmt(hund);
  return two("Which estimate is <b>closer</b> to the exact answer of <b>"+a+" + "+b+"</b>?", [optT,optH], tensCloser?0:1,
    "Exact: "+fmt(exact)+". The nearest-ten estimate is "+Math.abs(tens-exact)+" away, the nearest-hundred estimate is "+Math.abs(hund-exact)+" away. Rounding to tens is usually closer, rounding to hundreds is quicker.", EXP);
}
function roundTenQ(){
  let n; do { n=randNotMid(); } while(n%10===0||n%10===5);
  const right=round10(n);
  return mc("Round <b>"+n+"</b> to the nearest <b>ten</b>.", String(right), fill3(right,[right+10,right-10,round100(n),n-n%10+(n%10<5?10:0)]).map(String),
    "Look at the ones digit ("+(n%10)+"). "+(n%10<5?"It is less than 5, so round down to "+right+".":"It is 5 or more, so round up to "+right+"."), Object.assign({grid:true}, EXP));
}
const COMBO_SETS={

function buildMix(){
  const past=[forcesMC(pick(SCI)), pick([clockRead,numberLine,nearestHundredQ])(), pick([oreoOrder,sentenceType,inferenceQ])(), pick([()=>bankMC(LIB_MC,LIB)(pick(LIB_MC)),()=>packQ(pick(PACK)),()=>bankMC(MUS_MC,MUS)(pick(MUS_MC))])()];
  const grow=[pick([unitPickQ,barReadQ,rulerQ])(), pick([capitalFixQ,specificExampleQ])(), pick([distanceExplainQ,tenVsHundredQ])()];
  const now=[pick([stickerMissingQ,roundTenAddQ,trennbarQ,()=>bankMC(NOW_MC,NOW)(pick(NOW_MC))])()];
  return shuffle(past.concat(grow,now));
}

const state={screen:'home', world:null, round:[], idx:0, stars:0, streak:0, answered:false, typed:'', picked:[], results:[], studio:null};

function show(name){
  state.screen=name;
  home.hidden=name!=='home'; play.hidden=name!=='play'; results.hidden=name!=='results'; studioScreen.hidden=name!=='studio';
  if(name!=='studio') stopTimer();

}
function playerName(){ return ($('#playerName').value||'').trim(); }
function cardHTML(k, d, right){
  const mark=d.mark?`<br><span class="mark">${esc(d.from)} · <b>${esc(d.mark)}</b></span>`:'';

}
function renderHome(){

function startRound(k){
  state.world=k; state.round=WORLDS[k].build(); state.idx=0; state.stars=0; state.streak=0;
  state.results=state.round.map(()=>null);
  $('#worldChip').textContent=WORLDS[k].name;
  $('#roundStars').textContent='0';
  show('play'); renderQuestion();
}
function renderDots(){
  const d=$('#dots'); d.innerHTML='';
  state.round.forEach((_,i)=>{ const s=document.createElement('span'); s.className='dot'+(state.results[i]===true?' good':state.results[i]===false?' bad':i===state.idx?' cur':''); d.appendChild(s); });
}
function renderQuestion(){
  const q=state.round[state.idx];
  state.answered=false; state.typed=''; state.picked=[];
  play.style.setProperty('--world', WORLDS[q.world||state.world].color);
  $('#qLabel').textContent=q.label+' · Question '+(state.idx+1)+' of '+state.round.length;
  $('#qPrompt').innerHTML=q.prompt;
  const vis=$('#qVisual'); vis.innerHTML=q.visual||''; vis.hidden=!q.visual;
  const A=$('#qAnswers'); A.innerHTML=''; A.className='answers'+(q.grid?' grid':'')+(q.grid3?' grid3':'');
  const fb=$('#feedback'); fb.hidden=true; fb.innerHTML=''; fb.className='feedback';
  const nb=$('#nextBtn'); nb.hidden=true; nb.textContent=state.idx===state.round.length-1?'See my stars':'Next question';
  if(q.kind==='mc'){
    q.options.forEach((o,i)=>{
      const b=document.createElement('button'); b.type='button'; b.className='opt'+(q.vis?' vis':'');
      b.innerHTML=q.htmlOptions?o:esc(o); b.dataset.i=i;
      b.addEventListener('click',()=>answerMC(i)); A.appendChild(b);
    });
  } else if(q.kind==='type'){
    const out=document.createElement('div'); out.className='typed'; out.id='typedOut'; out.setAttribute('aria-live','polite'); A.appendChild(out);
    const np=document.createElement('div'); np.className='numpad';
    ['1','2','3','4','5','6','7','8','9','⌫','0','Check'].forEach(k=>{
      const b=document.createElement('button'); b.type='button'; b.className='key'+(k==='Check'?' go':''); b.textContent=k;
      b.setAttribute('aria-label', k==='⌫'?'Delete':k);
      b.addEventListener('click',()=>{
        if(state.answered) return;
        if(k==='⌫') state.typed=state.typed.slice(0,-1);
        else if(k==='Check'){ if(state.typed) answerTyped(); return; }
        else if(state.typed.length<4) state.typed+=k;
        out.textContent=state.typed;
      });
      np.appendChild(b);
    });
    A.appendChild(np);
  } else if(q.kind==='order'){
    const sl=document.createElement('div'); sl.className='slots';
    sl.innerHTML=q.slots?q.slots.map((s,i)=>`<span class="slot"><i>${i+1}</i>${esc(s)}</span>`).join(''):`<span class="slot"><i>1 → ${q.items.length}</i>${esc(q.hint||'Tap the steps in order')}</span>`;
    A.appendChild(sl);
    q.items.forEach((t,i)=>{
      const b=document.createElement('button'); b.type='button'; b.className='opt ord'; b.dataset.i=i;
      b.innerHTML=`<span class="badge">·</span><span>${esc(t)}</span>`;
      b.addEventListener('click',()=>toggleOrder(i)); A.appendChild(b);
    });
    const cb=document.createElement('button'); cb.type='button'; cb.className='btn primary'; cb.id='checkOrder'; cb.textContent='Check my order'; cb.disabled=true;
    cb.addEventListener('click',checkOrder); A.appendChild(cb);
  }
  renderDots(); snapshot();
}
function feedback(ok, q, wrongText){
  const fb=$('#feedback'); fb.className='feedback '+(ok?'good':'bad'); fb.hidden=false;
  const yay=pick(['Yes!','Brilliant!','Super!','Exactly right!','You got it!','Fantastic!']);
  const streakNote=(ok&&state.streak>=3)?' That is '+state.streak+' in a row!':'';
  fb.innerHTML=ok
    ? `<span class="mark">${yay}${streakNote}</span>${esc(q.explain)}`
    : `<span class="mark">Not quite.</span>${wrongText}${esc(q.explain)}`;
  $('#nextBtn').hidden=false;
  $('#nextBtn').focus({preventScroll:true});
  revealNext();
}
/* After answering, the explanation and the Next button often sat below the screen edge (phones, small laptops). Scroll just enough to show Next. */
function revealNext(){
  const nb=$('#nextBtn'), r=nb.getBoundingClientRect();
  if(r.top>=0 && r.bottom<=window.innerHeight) return;
  const still=window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  nb.scrollIntoView({block:'end', behavior:still?'auto':'smooth'});
}
function score(ok){
  state.answered=true; state.results[state.idx]=ok;
  if(ok){ state.stars++; state.streak++; } else state.streak=0;
  $('#roundStars').textContent=state.stars;
  beep(ok?'good':'bad'); renderDots();
}
function answerMC(i){
  if(state.answered) return;
  const q=state.round[state.idx], ok=i===q.answer;
  score(ok);
  document.querySelectorAll('#qAnswers .opt').forEach(b=>{
    const k=+b.dataset.i; b.disabled=true;
    if(k===q.answer) b.classList.add('correct'); else if(k===i) b.classList.add('wrong');
  });
  const ansText=q.htmlOptions?'the highlighted answer':'<b>'+esc(q.options[q.answer])+'</b>';
  feedback(ok, q, 'The answer is '+ansText+'. ');
  snapshot();
}
function answerTyped(){
  if(state.answered) return;
  const q=state.round[state.idx], ok=String(+state.typed)===q.answer;
  score(ok);
  const out=$('#typedOut'); out.style.borderStyle='solid'; out.style.borderColor=ok?'var(--good)':'var(--bad)';
  document.querySelectorAll('#qAnswers .key').forEach(b=>b.disabled=true);
  feedback(ok, q, 'The answer is <b>'+q.answer+'</b>. ');
  snapshot();
}
function toggleOrder(i){
  if(state.answered) return;
  const at=state.picked.indexOf(i);
  if(at>=0) state.picked=state.picked.slice(0,at); else state.picked.push(i);
  document.querySelectorAll('#qAnswers .ord').forEach(b=>{
    const k=+b.dataset.i, p=state.picked.indexOf(k);
    b.classList.toggle('picked',p>=0); b.querySelector('.badge').textContent=p>=0?p+1:'·';
  });
  $('#checkOrder').disabled=state.picked.length!==state.round[state.idx].items.length;
}
function checkOrder(){
  if(state.answered) return;
  const q=state.round[state.idx];
  const ok=state.picked.every((v,k)=>v===q.correct[k]);
  score(ok);
  document.querySelectorAll('#qAnswers .ord').forEach(b=>{
    const k=+b.dataset.i, p=state.picked.indexOf(k); b.disabled=true;
    b.classList.add(q.correct[p]===k?'correct':'wrong');
  });
  $('#checkOrder').hidden=true;
  const list='<ol>'+q.correct.map(i=>'<li>'+esc(q.items[i])+'</li>').join('')+'</ol>';
  feedback(ok, q, 'The right order is: '+list);
  snapshot();
}
function next(){
  if(!state.answered) return;
  if(state.idx<state.round.length-1){ state.idx++; renderQuestion(); } else showResults();
}
function showResults(){
  const n=state.round.length, s=state.stars, k=state.world, name=playerName();
  const total=store.get('total',0)+s; store.set('total',total);
  const best=store.get('best_'+k,0); if(s>best) store.set('best_'+k,s);
  $('#resWorld').textContent=WORLDS[k].name;
  $('#resScore').textContent=s;
  $('#bigStars').innerHTML=state.round.map((_,i)=>STAR.replace('<svg', i<s?'<svg class="on"':'<svg')).join('');
  const who=name?', '+name:'';
  let head, msg;
  if(s===n){ head='Perfect score'+who+'!'; msg='Every single answer right. You are a Grade 3 superstar!'; }
  else if(s>=6){ head='Fantastic work'+who+'!'; msg='Nearly perfect. One more round and you will have them all.'; }
  else if(s>=4){ head='Good job'+who+'!'; msg='You are getting there. Read the explanations and try again.'; }
  else { head='Nice try'+who+'!'; msg='Every game makes your brain stronger. Have another go!'; }
  if(s>best && best>0) msg+=' New best score for this quest!';
  $('#resHead').textContent=head; $('#resMsg').textContent=msg;
  show('results'); snapshot();
  if(s>=6){ beep('win'); confetti(); }
}

/* ---------- studios ---------- */
function fmtTime(ms){ const s=Math.floor(ms/1000); return pad(Math.floor(s/60))+':'+pad(s%60); }
function stopTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } }
function openStudio(k){
  const d=STUDIOS[k]; state.studio=k;
  studioScreen.style.setProperty('--world', d.color);
  $('#studioChip').textContent=d.name;
  const body=$('#studioBody');
  const checks=store.get('chk_'+k, d.checks.map(()=>false));
  while(checks.length<d.checks.length) checks.push(false);
  const done=checks.filter(Boolean).length;
  let html=`<div class="eyebrow">${esc(d.sub)}</div><h2>${esc(d.name)}</h2><p class="muted">${esc(d.intro)}</p>`;
  if(d.timer){
    html+=`<div class="timer"><span class="clock" id="tClock">00:00</span><span class="row" style="flex:1;justify-content:flex-end"><button class="btn small primary" id="tStart" type="button">Start</button><button class="btn small" id="tReset" type="button">Reset</button></span></div>`;
  }
  html+=`<div><div class="eyebrow" style="margin-bottom:8px">Checklist · <span id="chkCount">${done}</span> / ${d.checks.length}</div><div class="progress"><i id="chkBar" style="width:${Math.round(done/d.checks.length*100)}%"></i></div></div>`;
  html+=`<div class="checks" id="checks">`+d.checks.map((c,i)=>`<button type="button" class="chk${checks[i]?' on':''}" data-i="${i}" aria-pressed="${checks[i]?'true':'false'}"><span class="box">${TICK}</span><span class="t">${esc(c)}</span></button>`).join('')+`</div>`;
  if(d.extra){ html+=`<div><h3 style="margin-bottom:8px">${esc(d.extraTitle)}</h3><div class="checks">`+d.extra.map(t=>`<div class="twister">${esc(t)}</div>`).join('')+`</div></div>`; }
  if(d.tips){ html+=`<div><h3 style="margin-bottom:6px">Tips</h3><ul class="tips">`+d.tips.map(t=>`<li>${esc(t)}</li>`).join('')+`</ul></div>`; }
  html+=`<div class="row"><button class="btn small ghost" id="chkReset" type="button">Clear checklist</button></div>`;
  body.innerHTML=html;
  body.querySelectorAll('.chk').forEach(b=>b.addEventListener('click',()=>{
    const i=+b.dataset.i; checks[i]=!checks[i]; store.set('chk_'+k,checks);
    b.classList.toggle('on',checks[i]); b.setAttribute('aria-pressed',checks[i]?'true':'false');
    const n=checks.filter(Boolean).length; $('#chkCount').textContent=n; $('#chkBar').style.width=Math.round(n/d.checks.length*100)+'%';
    if(checks[i]) beep('good');
    if(n===d.checks.length){ beep('win'); confetti(); }
  }));
  $('#chkReset').addEventListener('click',()=>{ for(let i=0;i<checks.length;i++) checks[i]=false; store.set('chk_'+k,checks); openStudio(k); });
  if(d.timer){
    timerElapsed=0; stopTimer();
    const clock=$('#tClock'), startBtn=$('#tStart');
    startBtn.addEventListener('click',()=>{
      if(timerId){ stopTimer(); timerElapsed+=Date.now()-timerStart; startBtn.textContent='Start'; }
      else { timerStart=Date.now(); timerId=setInterval(()=>{ clock.textContent=fmtTime(timerElapsed+Date.now()-timerStart); },250); startBtn.textContent='Pause'; }
    });
    $('#tReset').addEventListener('click',()=>{ stopTimer(); timerElapsed=0; clock.textContent='00:00'; startBtn.textContent='Start'; });
  }
  show('studio'); snapshot();
}

function confetti(){
  try{
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const c=$('#confetti'), ctx=c.getContext('2d'), dpr=Math.min(2,window.devicePixelRatio||1);
    const W=window.innerWidth, H=window.innerHeight; c.width=W*dpr; c.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    const colors=['#FFB800','#3B5BDB','#12A594','#C2419A','#F5820D','#1FA971','#FF6B70','#7A4FD8'];
    const P=[]; for(let i=0;i<150;i++) P.push({x:W/2+(Math.random()-.5)*160, y:H*.38, vx:(Math.random()-.5)*10, vy:-Math.random()*12-3, s:6+Math.random()*7, c:pick(colors), r:Math.random()*Math.PI, vr:(Math.random()-.5)*.3});
    const t0=performance.now();
    (function frame(t){
      ctx.clearRect(0,0,W,H);
      P.forEach(p=>{ p.vy+=.28; p.x+=p.vx; p.y+=p.vy; p.vx*=.99; p.r+=p.vr; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6); ctx.restore(); });
      if(t-t0<3200) requestAnimationFrame(frame); else ctx.clearRect(0,0,W,H);
    })(t0);
  }catch(e){}
}

/* ---------- hot reload snapshot ---------- */
function snapshot(){ try{ const hot=window.claude&&window.claude.hot; hot&&hot.snapshot&&hot.snapshot(()=>state); }catch(e){} }

/* ---------- wiring ---------- */
$('#playerName').addEventListener('input',e=>store.set('name',e.target.value.trim()));
$('#soundBtn').addEventListener('click',()=>{ muted=!muted; store.set('muted',muted); $('#soundBtn').textContent='Sound: '+(muted?'off':'on'); if(!muted) beep('good'); });
$('#quitBtn').addEventListener('click',()=>{ renderHome(); show('home'); snapshot(); });
$('#studioBack').addEventListener('click',()=>{ renderHome(); show('home'); snapshot(); });
$('#nextBtn').addEventListener('click',next);
$('#againBtn').addEventListener('click',()=>startRound(state.world));
$('#homeBtn').addEventListener('click',()=>{ renderHome(); show('home'); snapshot(); });

function boot(data){
  renderHome();
  if(data && data.screen==='play' && Array.isArray(data.round) && data.round.length && WORLDS[data.world]){
    Object.assign(state, data); state.answered=false; state.typed=''; state.picked=[];
    $('#worldChip').textContent=WORLDS[state.world].name; $('#roundStars').textContent=state.stars;
    show('play'); renderQuestion();
  } else if(data && data.screen==='studio' && STUDIOS[data.studio]){ openStudio(data.studio); }
  else show('home');
}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.ready) hot.ready(boot); else boot((hot&&hot.data)||{});
})();
</script>
