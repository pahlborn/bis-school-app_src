{id:'sort',name:['Zahlen zuordnen','Sort numbers'],sub:['Ordnen','Classify'],title:['Welche Zahlen gehören zusammen?','Which numbers belong together?'],prompt:['Ordne die Zahlen: gerade oder ungerade.','Sort the numbers into even or odd.'],facts:[

{id:'build',name:['Fläche aufbauen','Build an area'],sub:['Darstellen','Represent'],title:['Färbe drei Achtel.','Shade three eighths.'],prompt:['Färbe 3 von 8 gleich großen Feldern. Du wählst die Felder selbst.','Shade 3 of 8 equal cells. You choose which cells.'],facts:[

const numbers=[12,7,18,9,4,15],targetBars=[3,5,2];
function fresh(){return {choice:null,number:'',line:null,sort:{},selected:null,tiles:Array(8).fill(false),bars:[0,0,0],strokes:[],cursor:{x:300,y:140},kbdLine:false,drawingText:'',measurement:'',explanation:'',feedback:''};}
let answers=tasks.map(fresh),reviews=tasks.map(()=>({decision:null,note:''}));
const c=()=>copy[lang],tx=a=>a[lang==='de'?0:1];
const esc=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
function button(action,label,extra=''){return `<button type="button" data-action="${action}" ${extra}>${label}</button>`;}
function fraction(n,label){return `<svg viewBox="0 0 160 108" role="img" aria-label="${esc(label)}">${Array.from({length:4},(_,i)=>`<rect x="${7+(i%2)*74}" y="${7+Math.floor(i/2)*47}" width="70" height="43" rx="3" fill="${i<n?'#397f6d':'#f1f2e9'}" stroke="#234e43" stroke-width="1.5"/>`).join('')}</svg>`;}
function numberSvg(position=null){return `<svg viewBox="0 0 600 160" aria-hidden="true"><line x1="45" y1="80" x2="555" y2="80" stroke="#314c43" stroke-width="3"/>${Array.from({length:9},(_,i)=>`<line x1="${45+i*63.75}" x2="${45+i*63.75}" y1="${i%4===0?65:71}" y2="${i%4===0?96:89}" stroke="#314c43" stroke-width="2"/>`).join('')}<text x="45" y="125" text-anchor="middle" fill="#203432" font-size="24">0</text><text x="300" y="125" text-anchor="middle" fill="#203432" font-size="20">½</text><text x="555" y="125" text-anchor="middle" fill="#203432" font-size="24">1</text>${position===null?'':`<circle cx="${45+position*63.75}" cy="80" r="12" fill="#25675d" stroke="white" stroke-width="3"/><path d="M${45+position*63.75} 57v-17" stroke="#25675d" stroke-width="2"/>`}</svg>`;}
function fractionValue(v){return v===null?'—':['0','⅛','¼','⅜','½','⅝','¾','⅞','1'][v];}
function chip(n){const a=answers[active];return button('select-number',String(n),`id="chip-${n}" class="number-chip" data-value="${n}" aria-pressed="${a.selected===n}"`);}
function drawingSvg(){const a=answers[active];return `<svg viewBox="0 0 600 280" aria-hidden="true"><defs><pattern id="dots" width="30" height="28" patternUnits="userSpaceOnUse"><circle cx="15" cy="14" r="1" fill="#cfdbcd"/></pattern></defs><rect width="600" height="280" fill="url(#dots)"/>${a.strokes.map(s=>s.length===1?`<circle cx="${s[0].x}" cy="${s[0].y}" r="4" fill="#25675d"/>`:`<polyline points="${s.map(p=>p.x+','+p.y).join(' ')}" fill="none" stroke="#25675d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>`).join('')}<g stroke="#a14c13" stroke-width="2"><circle cx="${a.cursor.x}" cy="${a.cursor.y}" r="9" fill="white"/><path d="M${a.cursor.x-14} ${a.cursor.y}h28 M${a.cursor.x} ${a.cursor.y-14}v28"/></g></svg>`;}
function workspace(){const t=c(),a=answers[active];switch(active){
case 0:return `<div class="choice-grid">${[3,2,1].map((n,i)=>button('choice',fraction(n,`${n} ${t.fractionAlt}`)+`<span>${t.picture} ${'ABC'[i]}</span>`,`id="choice-${i}" class="choice" data-value="${i}" aria-pressed="${a.choice===i}"`)).join('')}</div>`;
case 1:return `<div class="equation" aria-hidden="true">24 + 18 = ?</div><label for="number-answer" class="sr-only">${t.answer}</label><input id="number-answer" class="answer-input" type="text" inputmode="numeric" maxlength="3" autocomplete="off" value="${esc(a.number)}" aria-describedby="number-help"><div class="keypad" aria-label="${t.answer}">${[1,2,3,4,5,6,7,8,9,'clear',0,'erase'].map(v=>button('key',v==='clear'?t.clear:v==='erase'?'⌫':v,`id="key-${v}" data-value="${v}" ${typeof v==='string'?`class="small" aria-label="${v==='clear'?t.clear:t.erase}"`:''}`)).join('')}</div><p id="number-help" class="hint">${t.digits}</p>`;
case 2:return `<p class="hint">${t.lineHelp}</p><div id="number-line" class="numberline" tabindex="0" role="slider" aria-label="${t.lineLabel}" aria-valuemin="0" aria-valuemax="8" aria-valuenow="${a.line??0}" aria-valuetext="${a.line===null?t.lineNone:fractionValue(a.line)}" aria-describedby="line-help">${numberSvg(a.line)}</div><div class="row step-controls">${button('line-step','−',`id="line-minus" data-value="-1" aria-label="${t.stepBack}"`)}<output aria-live="polite">${fractionValue(a.line)}</output>${button('line-step','+',`id="line-plus" data-value="1" aria-label="${t.stepForward}"`)}</div><p id="line-help" class="hint">${t.lineKeyboard}</p>`;
case 3:return `<p class="hint">${t.chooseNumber}</p><h3 style="margin-top:18px">${t.unassigned}</h3><div class="pool">${numbers.filter(n=>a.sort[n]===undefined).map(chip).join('')}</div><div class="bins">${['even','odd'].map(group=>`<div class="bin">${button('assign',t[group],`id="assign-${group}" data-value="${group}" ${a.selected===null?'disabled':''}`)}<div class="pool">${numbers.filter(n=>a.sort[n]===group).map(chip).join('')}</div></div>`).join('')}</div><div style="margin-top:14px">${button('assign',t.returnNumber,`id="assign-return" data-value="return" ${a.selected===null?'disabled':''}`)}</div>`;
case 4:return `<p class="hint">${t.colorHelp}</p><div class="tile-grid">${a.tiles.map((v,i)=>button('tile',`<span class="tick" aria-hidden="true">${v?'✓':'·'}</span><span>${i+1}</span>`,`id="tile-${i}" class="tile" data-value="${i}" aria-label="${t.field} ${i+1}" aria-pressed="${v}"`)).join('')}</div><p class="counter" aria-live="polite">${a.tiles.filter(Boolean).length} ${t.colorCount}</p>`;
case 5:return `${dataTable()}<p class="hint">${t.chartHelp}</p><div class="chart-area" role="img" aria-label="${t.chartAlt}: ${t.shapes.map((s,i)=>s+' '+a.bars[i]).join(', ')}"><div class="scale" aria-hidden="true">${[6,5,4,3,2,1,0].map(n=>`<span>${n}</span>`).join('')}</div><div class="bars" aria-hidden="true">${a.bars.map(v=>`<div class="bar-track"><div class="bar" style="height:${v/6*100}%"></div></div>`).join('')}</div></div><div class="chart-controls">${a.bars.map((v,i)=>`<div><label>${t.shapes[i]}</label><output aria-live="polite">${v}</output><div class="row">${button('bar','−',`id="bar-${i}-minus" data-index="${i}" data-value="-1" aria-label="${t.shapes[i]}: ${t.less}" ${v===0?'disabled':''}`)}${button('bar','+',`id="bar-${i}-plus" data-index="${i}" data-value="1" aria-label="${t.shapes[i]}: ${t.more}" ${v===6?'disabled':''}`)}</div></div>`).join('')}</div>`;
case 6:return `<p class="hint" style="margin-bottom:10px">${t.drawHelp}</p><div id="drawing-surface" class="draw-surface" tabindex="0" role="group" aria-label="${t.drawLabel}" aria-describedby="drawing-help">${drawingSvg()}</div><div class="draw-tools">${button('add-point',t.addPoint,'id="add-point"')}${button('end-line',t.endLine,'id="end-line"')}${button('undo',t.undo,`id="undo" ${a.strokes.length?'':'disabled'}`)}${button('clear-drawing',t.clear,'id="clear-drawing"')}</div><div id="drawing-help" class="keyboard-help"><strong>${t.keyboardTitle}</strong>${t.keyboardHelp}</div><label for="drawing-text" class="note-label" style="margin-top:16px">${t.drawingText}</label><textarea id="drawing-text" maxlength="2000">${esc(a.drawingText)}</textarea>`;
case 7:return `<div class="human-label">${t.human}</div><div class="stack"><label>${t.measurement}<input id="measurement" type="text" inputmode="decimal" maxlength="40" autocomplete="off" value="${esc(a.measurement)}"></label><label>${t.explanation}<textarea id="explanation" maxlength="2000" placeholder="${esc(t.measurePlaceholder)}">${esc(a.explanation)}</textarea></label></div>`;
}}
function dataTable(){const t=c();return `<table class="data-table"><caption class="sr-only">${t.data}</caption><thead><tr><th scope="col">${t.category}</th><th scope="col">${t.count}</th></tr></thead><tbody>${t.shapes.map((s,i)=>`<tr><th scope="row">${s}</th><td>${targetBars[i]}</td></tr>`).join('')}</tbody></table>`;}
function feedback(){const f=answers[active].feedback;return `<div id="feedback" class="feedback ${f?'':'empty'}" role="status">${f?c()[f]:c().start}</div>`;}
function render(restore=true){const old=restore?document.activeElement?.id:null,t=c(),task=tasks[active],a=answers[active],r=reviews[active];document.documentElement.lang=lang;document.title=lang==='de'?'Lernaufgaben · unabhängiger UI-Entwurf':'Learning tasks · independent UI design';
document.getElementById('app').innerHTML=`<header class="topbar"><div class="wordmark"><span class="mark" aria-hidden="true">↗</span><span>${t.brand}<br><span style="font-size:12px;font-weight:500;color:var(--muted)">${t.lab}</span></span></div><div class="lang" role="group" aria-label="${lang==='de'?'Sprache':'Language'}">${button('language','DE',`id="language-de" lang="de" data-value="de" aria-label="Deutsch" aria-pressed="${lang==='de'}"`)}${button('language','EN',`id="language-en" lang="en" data-value="en" aria-label="English" aria-pressed="${lang==='en'}"`)}</div></header><section class="hero"><div><p class="eyebrow">${t.eyebrow}</p><h1>${t.headline}</h1></div><div class="intro"><p><strong>${t.intro}</strong></p><p>${t.scope}</p></div></section><main class="lab"><nav class="nav" aria-label="${t.lab}">${tasks.map((item,i)=>button('task',`<span class="num">${String(i+1).padStart(2,'0')}</span><span>${tx(item.name)}<small>${tx(item.sub)}</small></span>`,`id="nav-${i}" data-value="${i}" aria-pressed="${i===active}"`)).join('')}</nav><section class="card task" aria-labelledby="task-title"><div class="task-heading"><div class="row"><span class="eyebrow" style="margin:0">${String(active+1).padStart(2,'0')} / 08 · ${t.task}</span><span class="badge">${t.fiction}</span></div><h2 id="task-title">${tx(task.title)}</h2><p>${tx(task.prompt)}</p></div><div class="workspace">${workspace()}</div><div class="task-footer"><div class="toolbar">${button('check',active>=6?t.ready:t.check,'id="check-answer" class="primary"')}${button('restart',t.restart,'id="restart-task"')}</div>${feedback()}</div></section><aside class="card review" aria-labelledby="review-title"><p class="eyebrow">${t.reviewCaption}</p><h2 id="review-title">${t.review}</h2><dl class="facts">${task.facts.map((fact,i)=>`<dt>${t.facts[i]}</dt><dd>${tx(fact)}</dd>`).join('')}</dl><fieldset class="decision"><legend>${t.decision}</legend>${t.decisions.map((label,i)=>`<label><input type="radio" name="decision" value="${i}" ${r.decision===i?'checked':''}>${label}</label>`).join('')}</fieldset><label class="note-label" for="review-note">${t.note}</label><textarea id="review-note" maxlength="4000" aria-describedby="note-hint">${esc(r.note)}</textarea><p class="decision-note" id="note-hint">${t.noteHint}</p></aside></main><footer class="bottom"><div><span class="badge">${t.offline}</span><p style="margin-top:10px">${t.memory}</p></div><div><span id="marked-count" class="status-count">${reviews.filter(v=>v.decision!==null).length} ${t.marked}</span><div class="secondary-tools">${button('paper',paperOpen?t.closePaper:t.print,'id="toggle-paper" aria-controls="paper" aria-expanded="'+paperOpen+'"')}${button('download',t.download,'id="download-decisions"')}${button('reset-all',t.allReset,'id="reset-all"')}</div><p id="download-status" role="status"></p></div></footer>`;
document.querySelector('.mark').innerHTML='<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 18V6h14M6 17 18 6M11 6h8v8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
renderPaper();bindSurfaces();if(old){document.getElementById(old)?.focus({preventScroll:true});}}
function renderPaper(){const t=c(),task=tasks[active];let content='';switch(active){case 0:content=`<div class="choice-grid">${[3,2,1].map((n,i)=>`<div class="choice">${fraction(n,`${n} ${t.fractionAlt}`)}<span>○ ${t.picture} ${'ABC'[i]}</span></div>`).join('')}</div>`;break;case 1:content=`<div class="equation">24 + 18 = ______</div><p>${t.paperExplain}</p><div class="blank"></div>`;break;case 2:content=`<div class="numberline">${numberSvg()}</div><p class="hint">${t.paperExplain}</p><div class="answer-line"></div>`;break;case 3:content=`<p>${numbers.join(' · ')}</p><p class="hint">${t.paperSort}</p><div class="bins"><div class="bin"><h3>${t.even}</h3><div style="height:140px"></div></div><div class="bin"><h3>${t.odd}</h3><div style="height:140px"></div></div></div>`;break;case 4:content=`<div class="tile-grid">${Array.from({length:8},()=>'<div class="blank-tile"></div>').join('')}</div>`;break;case 5:content=`${dataTable()}<svg viewBox="0 0 600 300" role="img" aria-label="${t.chartAlt}">${[0,1,2,3,4,5,6].map(n=>`<text x="29" y="${257-n*35}" text-anchor="end" font-size="16">${n}</text><line x1="40" x2="575" y1="${250-n*35}" y2="${250-n*35}" stroke="#b9c8be"/>`).join('')}<path d="M40 40V250H575" fill="none" stroke="#263f34" stroke-width="2"/>${t.shapes.map((s,i)=>`<text x="${130+i*180}" y="283" text-anchor="middle" font-size="16">${s}</text>`).join('')}</svg>`;break;case 6:content=`<p class="hint">${t.paperDraw}</p><div class="blank"></div><p>${t.paperExplain}</p><div class="answer-line"></div>`;break;case 7:content=`<p>${t.paperMeasure}</p><p style="margin-top:30px">${t.paperExplain}</p><div class="blank"></div>`;break;}
const paper=document.getElementById('paper');paper.className='paper'+(paperOpen?' open':'');paper.innerHTML=`<div class="print-actions"><p class="hint" style="margin:0 0 12px">${t.paperHint}</p>${button('print',t.printNow,'class="primary"')} ${button('paper',t.closePaper)}</div><p class="print-label">${t.paperLabel}</p><h2 id="paper-title" style="margin-top:15px">${tx(task.title)}</h2><p class="print-instruction">${tx(task.prompt)}</p>${content}`;
}
function clearFeedback(){answers[active].feedback='';const el=document.getElementById('feedback');if(el){el.textContent=c().start;el.classList.add('empty');}}
function showFeedback(key){answers[active].feedback=key;const el=document.getElementById('feedback');el.classList.remove('empty');el.textContent=c()[key];}
function check(){const a=answers[active];switch(active){case 0:showFeedback(a.choice===null?'noChoice':a.choice===0?'good':'fractionHint');break;case 1:showFeedback(!a.number.trim()?'numberEmpty':!/^\d{1,3}$/.test(a.number)?'digits':Number(a.number)===42?'good':'numberHint');break;case 2:showFeedback(a.line===null?'lineEmpty':a.line===6?'good':'lineHint');break;case 3:showFeedback(numbers.some(n=>a.sort[n]===undefined)?'sortEmpty':numbers.every(n=>a.sort[n]===(n%2?'odd':'even'))?'good':'sortHint');break;case 4:showFeedback(a.tiles.filter(Boolean).length===3?'good':'colorHint');break;case 5:showFeedback(a.bars.every((v,i)=>v===targetBars[i])?'good':'chartHint');break;case 6:showFeedback(a.strokes.length||a.drawingText.trim()?'drawingFeedback':'drawingEmpty');break;case 7:showFeedback(a.measurement.trim()||a.explanation.trim()?'humanFeedback':'humanEmpty');break;}}
function lineSet(v){clearFeedback();answers[active].line=Math.max(0,Math.min(8,v));render();}
function addPoint(){const a=answers[active];clearFeedback();if(!a.kbdLine){a.strokes.push([]);a.kbdLine=true;}a.strokes.at(-1).push({...a.cursor});render();}
function download(){const t=c();const lines=[t.exportTitle,t.exportScope,'',...tasks.flatMap((task,i)=>[`${String(i+1).padStart(2,'0')} · ${tx(task.name)}`,`${t.decision}: ${reviews[i].decision===null?t.unset:t.decisions[reviews[i].decision]}`,`${t.exportNote}: ${reviews[i].note||t.exportEmpty}`,...task.facts.map((fact,j)=>`${t.facts[j]} ${tx(fact)}`),''])];const blob=new Blob(['\uFEFF'+lines.join('\n')],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=`lernaufgaben-ui-entscheidungen-${lang}.txt`;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);document.getElementById('download-status').textContent=t.downloaded;}
document.addEventListener('click',event=>{const b=event.target.closest('button[data-action]');if(!b||b.disabled)return;const a=answers[active],v=b.dataset.value;switch(b.dataset.action){
case 'language':lang=v;render();break;
case 'task':active=Number(v);render();break;
case 'choice':clearFeedback();a.choice=Number(v);render();break;
case 'key':clearFeedback();a.number=v==='clear'?'':v==='erase'?a.number.slice(0,-1):(a.number+v).slice(0,3);render();break;
case 'line-step':lineSet((a.line??0)+Number(v));break;
case 'select-number':a.selected=a.selected===Number(v)?null:Number(v);render();break;
case 'assign':if(a.selected!==null){clearFeedback();const n=a.selected;if(v==='return')delete a.sort[n];else a.sort[n]=v;a.selected=null;render();document.getElementById('chip-'+n)?.focus({preventScroll:true});}break;
case 'tile':clearFeedback();a.tiles[Number(v)]=!a.tiles[Number(v)];render();break;
case 'bar':{clearFeedback();const i=Number(b.dataset.index);a.bars[i]=Math.max(0,Math.min(6,a.bars[i]+Number(v)));render();if(a.bars[i]===0||a.bars[i]===6)document.getElementById(`bar-${i}-${a.bars[i]===0?'plus':'minus'}`)?.focus({preventScroll:true});break;}
case 'add-point':addPoint();break;
case 'end-line':a.kbdLine=false;render();break;
case 'undo':clearFeedback();a.strokes.pop();a.kbdLine=false;render();if(!a.strokes.length)document.getElementById('drawing-surface')?.focus({preventScroll:true});break;
case 'clear-drawing':clearFeedback();a.strokes=[];a.kbdLine=false;render();break;
case 'check':check();break;
case 'restart':answers[active]=fresh();render();break;
case 'reset-all':answers=tasks.map(fresh);reviews=tasks.map(()=>({decision:null,note:''}));render();break;
case 'paper':paperOpen=!paperOpen;render();if(paperOpen)document.getElementById('paper').scrollIntoView({behavior:'instant',block:'start'});break;
case 'print':window.print();break;
case 'download':download();break;
}});
document.addEventListener('input',e=>{const a=answers[active];switch(e.target.id){case 'number-answer':a.number=e.target.value;clearFeedback();break;case 'review-note':reviews[active].note=e.target.value;break;case 'drawing-text':a.drawingText=e.target.value;clearFeedback();break;case 'measurement':a.measurement=e.target.value;clearFeedback();break;case 'explanation':a.explanation=e.target.value;clearFeedback();break;}});
document.addEventListener('change',e=>{if(e.target.name==='decision'){reviews[active].decision=Number(e.target.value);document.getElementById('marked-count').textContent=`${reviews.filter(v=>v.decision!==null).length} ${c().marked}`;}});
document.addEventListener('keydown',e=>{if(e.target.id==='number-answer'&&e.key==='Enter'){e.preventDefault();check();}});
function svgPoint(svg,event){const p=svg.createSVGPoint();p.x=event.clientX;p.y=event.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
function bindSurfaces(){const line=document.getElementById('number-line');if(line){line.addEventListener('click',e=>{const p=svgPoint(line.querySelector('svg'),e);lineSet(Math.round((p.x-45)/63.75));});line.addEventListener('keydown',e=>{let v=answers[active].line??0;if(['ArrowRight','ArrowUp'].includes(e.key))v++;else if(['ArrowLeft','ArrowDown'].includes(e.key))v--;else if(e.key==='Home')v=0;else if(e.key==='End')v=8;else return;e.preventDefault();lineSet(v);});}
const draw=document.getElementById('drawing-surface');if(!draw)return;let drawing=false;const point=e=>{const p=svgPoint(draw.querySelector('svg'),e);return {x:Math.round(Math.max(5,Math.min(595,p.x))),y:Math.round(Math.max(5,Math.min(275,p.y)))};};const paint=()=>{draw.innerHTML=drawingSvg();};
draw.addEventListener('pointerdown',e=>{if(e.button!==0)return;e.preventDefault();draw.focus({preventScroll:true});draw.setPointerCapture(e.pointerId);drawing=true;const a=answers[active];a.kbdLine=false;clearFeedback();a.strokes.push([point(e)]);paint();});
draw.addEventListener('pointermove',e=>{if(!drawing)return;const stroke=answers[active].strokes.at(-1),p=point(e),last=stroke.at(-1);if(Math.hypot(p.x-last.x,p.y-last.y)>2){stroke.push(p);paint();}});
const end=()=>{if(!drawing)return;drawing=false;const undo=document.getElementById('undo');if(undo)undo.disabled=false;};draw.addEventListener('pointerup',end);draw.addEventListener('pointercancel',end);draw.addEventListener('lostpointercapture',end);
draw.addEventListener('keydown',e=>{const a=answers[active],step=e.shiftKey?5:30;let moved=true;if(e.key==='ArrowLeft')a.cursor.x-=step;else if(e.key==='ArrowRight')a.cursor.x+=step;else if(e.key==='ArrowUp')a.cursor.y-=step;else if(e.key==='ArrowDown')a.cursor.y+=step;else moved=false;if(moved){e.preventDefault();a.cursor.x=Math.max(15,Math.min(585,a.cursor.x));a.cursor.y=Math.max(14,Math.min(266,a.cursor.y));paint();}else if(e.key===' '){e.preventDefault();addPoint();}else if(e.key==='Enter'){e.preventDefault();a.kbdLine=false;}else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();a.strokes.pop();a.kbdLine=false;render();}});
}
window.addEventListener('beforeprint',renderPaper);
render(false);
</script>
