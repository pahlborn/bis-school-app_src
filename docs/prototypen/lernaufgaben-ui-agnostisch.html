const tasks=[
{id:'choice',name:['Bild auswählen','Choose a picture'],sub:['Erkennen','Recognize'],title:['Welches Bild zeigt ¾?','Which picture shows ¾?'],prompt:['Wähle ein Bild. Drei von vier Teilen sollen gefärbt sein.','Choose a picture. Three out of four parts should be shaded.'],facts:[
['Wenn ein Kind Brüche in gleich großen Flächen erkennen soll. Die Auswahl macht Vergleiche einfach.','When a learner identifies fractions in equal areas. Choices make comparisons easy.'],
['Alle Teile sind gleich groß. Große Bildschaltflächen; eine Auswahl, jederzeit änderbar. Tastatur: Tab und Leertaste.','All parts have equal areas. Large picture buttons; one choice, changeable at any point. Keyboard: Tab and Space.'],
['Die gewählte Abbildung ist prüfbar. Ob das Kind den Bruch versteht oder geraten hat, zeigt die Auswahl allein nicht.','The selected picture can be checked. A choice alone cannot show understanding or distinguish it from a guess.'],
['Dieselben drei Bilder ankreuzen. Darstellungen und Fragestellung bleiben gleich.','Tick one of the same three pictures. The representations and question stay the same.'],
['Wie viele Antwortbilder helfen beim Vergleichen, ohne zum Raten einzuladen?','How many pictures support comparison without encouraging guessing?']]},
{id:'number',name:['Zahl eingeben','Enter a number'],sub:['Berechnen','Calculate'],title:['Wie viel ist 24 + 18?','What is 24 + 18?'],prompt:['Rechne aus. Trage deine Zahl ein.','Work it out. Enter your number.'],facts:[
['Für Aufgaben mit einem eindeutigen Zahlenergebnis. Die Eingabe gibt keine Antwortmöglichkeiten vor.','For tasks with one numerical result. The input does not offer possible answers.'],
['Zifferntastatur und echte Tastatur führen zum selben Feld. Löschen und Korrigieren sind möglich. Dieser Entwurf nutzt ganze Zahlen.','The on-screen keypad and physical keyboard use the same field. Answers can be corrected. This draft uses whole numbers.'],
['Die Zahl 42 ist prüfbar. Rechenweg, Stellenverständnis und verwendete Hilfe bleiben im Gespräch zu klären.','The result 42 can be checked. Strategy, place-value understanding, and any help used need discussion.'],
['24 + 18 = ____ mit Platz für einen Rechenweg. Das Eingabewerkzeug entfällt.','24 + 18 = ____ with space to show the work. The input tool is unnecessary.'],
['Welche Zahlbereiche, Vorzeichen und Dezimaltrennzeichen braucht die spätere Aufgabe?','Which number ranges, signs, and decimal separators will a future task need?']]},
{id:'line',name:['Punkt platzieren','Place a point'],sub:['Verorten','Locate'],title:['Wo liegt ¾?','Where is ¾?'],prompt:['Setze einen Punkt bei drei Vierteln.','Place a point at three quarters.'],facts:[
['Wenn Zahlen als Größen und Abstände verstanden werden sollen. Hier wird ein Bruch auf dem Zahlenstrahl verortet.','When numbers are understood as magnitudes and distances. Here, a fraction is located on a number line.'],
['Antippen setzt den Punkt auf eine Achtelmarke. Pfeiltasten und große Schrittknöpfe bieten denselben Weg; Ziehen ist nicht nötig.','Tapping places the point on an eighth mark. Arrow keys and large step buttons offer the same control; dragging is not required.'],
['Die Position 6/8 ist prüfbar. Die feste Teilung unterstützt die Eingabe; freies Schätzen wird hier nicht geprüft.','The position 6/8 can be checked. Fixed divisions support input; this does not assess free estimation.'],
['Den gleichen Zahlenstrahl mit Achtelmarken drucken. Das Kind setzt selbst einen Punkt.','Print the same number line with eighth marks. The learner adds a point.'],
['Feste Teilung oder freier Punkt mit begründeter Toleranz? Das verändert die Anforderung.','Fixed divisions or a free point with a justified tolerance? This changes the demand.']]},
{id:'sort',name:['Zahlen zuordnen','Sort numbers'],sub:['Ordnen','Classify'],title:['Welche Zahlen gehören zusammen?','Which numbers belong together?'],prompt:['Ordne die Zahlen: gerade oder ungerade.','Sort the numbers into even or odd.'],facts:[
['Für Gruppen mit klaren Eigenschaften. Das Kind zeigt eine Zuordnung statt nur eine einzelne Auswahl.','For groups with clear properties. The learner shows a classification rather than a single choice.'],
['Zahl wählen, dann Ziel antippen. Jede Zahl bleibt erneut wählbar und kann zurückgelegt werden. Kein Ziehen erforderlich.','Choose a number, then tap its destination. Every number can be selected again and returned. No dragging required.'],
['Alle sechs Zuordnungen sind prüfbar. Die Begründung für „gerade“ braucht eine Erklärung.','All six placements can be checked. The reason a number is even needs an explanation.'],
['Die Zahlen in zwei beschriftete Kästen schreiben oder mit Linien verbinden.','Write the numbers in two labeled boxes or connect them with lines.'],
['Soll eine spätere Aufgabe mehrere passende Gruppen oder ausdrücklich nur eine erlauben?','Should a future task allow multiple matching groups or exactly one?']]},
{id:'build',name:['Fläche aufbauen','Build an area'],sub:['Darstellen','Represent'],title:['Färbe drei Achtel.','Shade three eighths.'],prompt:['Färbe 3 von 8 gleich großen Feldern. Du wählst die Felder selbst.','Shade 3 of 8 equal cells. You choose which cells.'],facts:[
['Wenn das Kind eine Darstellung selbst erzeugen soll. Viele verschiedene Anordnungen können dieselbe Menge zeigen.','When a learner creates a representation. Many arrangements can show the same quantity.'],
['Acht gleich große Schaltflächen; jede einzeln umschaltbar. Farbe und Häkchen zeigen den Zustand.','Eight equal buttons; each can be toggled separately. Color and a check mark show the state.'],
['Genau drei gefärbte Felder sind prüfbar. Zusammenhängende Flächen werden nicht verlangt; mehrere Lösungen sind gleichwertig.','Exactly three shaded cells can be checked. Cells need not touch; multiple solutions are equally valid.'],
['Dasselbe 2-mal-4-Raster ausmalen. Die Wahl der Felder bleibt frei.','Shade the same 2-by-4 grid. Any three cells may be chosen.'],
['Hilft der sichtbare Zähler beim Lernen, oder nimmt er einer Prüfaufgabe einen Teil des Denkens ab?','Does the visible count support learning, or remove part of the thinking in an assessment?']]},
{id:'chart',name:['Balken bauen','Build a chart'],sub:['Daten zeigen','Show data'],title:['Zeige die Formen als Balken.','Show the shapes as bars.'],prompt:['Lies die Tabelle. Baue für jede Form einen passenden Balken.','Read the table. Build a matching bar for each shape.'],facts:[
['Für den Wechsel zwischen Tabelle und Balkendiagramm. Die Daten sind vorgegeben, die Darstellung entsteht durch Eingabe.','For translating a table into a bar chart. The data is given; input creates the representation.'],
['Skala 0–6 mit Einerschritten und Beschriftung. Große Plus-/Minusknöpfe je Balken; Werte bleiben sichtbar.','A labeled 0–6 scale in steps of one. Large plus/minus buttons for each bar; values remain visible.'],
['Die drei Balkenhöhen sind prüfbar. Achsenwahl, Skalierung und Beschriftung sind vorgegeben und werden hier nicht geprüft.','The three bar heights can be checked. Axes, scale, and labels are given and are not assessed here.'],
['Tabelle und leeres Raster mit derselben Skala drucken. Das Kind zeichnet die Balken ein.','Print the table and an empty grid with the same scale. The learner draws the bars.'],
['Soll das Kind nur Daten übertragen oder auch Achsen und Skala selbst wählen?','Should the learner only transfer data, or also choose axes and scale?']]},
{id:'draw',name:['Skizze zeichnen','Draw a sketch'],sub:['Offen zeigen','Show freely'],title:['Zeichne ein Rechteck.','Draw a rectangle.'],prompt:['Zeichne ein Rechteck. Markiere seine vier Ecken.','Draw a rectangle. Mark its four corners.'],facts:[
['Für eigene Darstellungen und sichtbare Denkwege. Eine Skizze kann mehr zeigen als eine Zahl.','For original representations and visible thinking. A sketch can show more than a number.'],
['Freihand mit Finger, Stift oder Maus. Alternativ Punkte mit der Tastatur verbinden oder in Worten beschreiben. Rückgängig und Leeren sind vorhanden.','Draw with a finger, pen, or mouse. Alternatively, connect points using the keyboard or describe it in words. Undo and Clear are available.'],
['Der Entwurf erkennt nur, ob Striche oder Text vorliegen. Form, Winkel und markierte Ecken werden menschlich besprochen.','The draft only detects strokes or text. Shape, angles, and marked corners require human discussion.'],
['Ein leerer Rahmen für die Skizze und Platz für eine Erklärung. Der Stift ersetzt das Zeichenfeld.','An empty frame for the sketch and space for an explanation. A pencil replaces the drawing surface.'],
['Ist die Skizze selbst das Lernziel, oder braucht es zusätzlich eine gleichwertige mündliche Antwort?','Is the sketch itself the learning goal, or is an equivalent spoken answer also needed?']]},
{id:'human',name:['Messen & erklären','Measure & explain'],sub:['Real handeln','Act in the world'],title:['Miss eine Kante.','Measure an edge.'],prompt:['Nimm ein Blatt und ein Lineal. Miss eine kurze Kante des Blatts. Erkläre, wie du gemessen hast.','Take a sheet of paper and a ruler. Measure a short edge of the sheet. Explain how you measured.'],facts:[
['Wenn eine reale Handlung zum Lernziel gehört: anlegen, ablesen und den eigenen Messweg erklären.','When a real action is the learning goal: aligning, reading a scale, and explaining the method.'],
['Ein echtes Lineal und ein Blatt sind nötig. Eingaben halten die Beobachtung fest. Eine Person bespricht die Handlung.','A real ruler and sheet of paper are needed. Entries record an observation. A person discusses the action.'],
['Keine automatische Richtigprüfung. Ohne beobachtete Handlung und bekanntes Blattmaß lässt sich die Messung nicht bewerten.','No automatic correctness check. A measurement cannot be assessed without observing the action and knowing the sheet’s dimensions.'],
['Dieselbe Handlung mit Blatt und Lineal. Messung und Erklärung können aufgeschrieben oder mündlich gezeigt werden.','The same action with a sheet and ruler. The measurement and explanation can be written or shown orally.'],
['Wer führt das Gespräch, und welche Beobachtungen zeigen, dass das Kind sicher misst?','Who leads the discussion, and which observations demonstrate confident measuring?']]}

case 4:return `<p class="hint">${t.colorHelp}</p><div class="tile-grid">${a.tiles.map((v,i)=>button('tile',`<span class="tick" aria-hidden="true">${v?'✓':'·'}</span><span>${i+1}</span>`,`id="tile-${i}" class="tile" data-value="${i}" aria-label="${t.field} ${i+1}" aria-pressed="${v}"`)).join('')}</div><p class="counter" aria-live="polite">${a.tiles.filter(Boolean).length} ${t.colorCount}</p>`;
case 5:return `${dataTable()}<p class="hint">${t.chartHelp}</p><div class="chart-area" role="img" aria-label="${t.chartAlt}: ${t.shapes.map((s,i)=>s+' '+a.bars[i]).join(', ')}"><div class="scale" aria-hidden="true">${[6,5,4,3,2,1,0].map(n=>`<span>${n}</span>`).join('')}</div><div class="bars" aria-hidden="true">${a.bars.map(v=>`<div class="bar-track"><div class="bar" style="height:${v/6*100}%"></div></div>`).join('')}</div></div><div class="chart-controls">${a.bars.map((v,i)=>`<div><label>${t.shapes[i]}</label><output aria-live="polite">${v}</output><div class="row">${button('bar','−',`id="bar-${i}-minus" data-index="${i}" data-value="-1" aria-label="${t.shapes[i]}: ${t.less}" ${v===0?'disabled':''}`)}${button('bar','+',`id="bar-${i}-plus" data-index="${i}" data-value="1" aria-label="${t.shapes[i]}: ${t.more}" ${v===6?'disabled':''}`)}</div></div>`).join('')}</div>`;
case 6:return `<p class="hint" style="margin-bottom:10px">${t.drawHelp}</p><div id="drawing-surface" class="draw-surface" tabindex="0" role="group" aria-label="${t.drawLabel}" aria-describedby="drawing-help">${drawingSvg()}</div><div class="draw-tools">${button('add-point',t.addPoint,'id="add-point"')}${button('end-line',t.endLine,'id="end-line"')}${button('undo',t.undo,`id="undo" ${a.strokes.length?'':'disabled'}`)}${button('clear-drawing',t.clear,'id="clear-drawing"')}</div><div id="drawing-help" class="keyboard-help"><strong>${t.keyboardTitle}</strong>${t.keyboardHelp}</div><label for="drawing-text" class="note-label" style="margin-top:16px">${t.drawingText}</label><textarea id="drawing-text" maxlength="2000">${esc(a.drawingText)}</textarea>`;
case 7:return `<div class="human-label">${t.human}</div><div class="stack"><label>${t.measurement}<input id="measurement" type="text" inputmode="decimal" maxlength="40" autocomplete="off" value="${esc(a.measurement)}"></label><label>${t.explanation}<textarea id="explanation" maxlength="2000" placeholder="${esc(t.measurePlaceholder)}">${esc(a.explanation)}</textarea></label></div>`;
case 8:return `<div class="text-options" role="group" aria-label="${t.answer}">${[640,650,660].map(n=>button('text-choice',String(n),`id="text-${n}" data-value="${n}" aria-pressed="${a.textChoice===n}"`)).join('')}</div>`;
case 9:return `<p class="hint" style="margin-bottom:15px">${t.orderHelp}</p><div class="order-options">${orderDisplay.map(i=>{const at=a.order.indexOf(i);return button('order-choice',`<span class="position" aria-hidden="true">${at<0?'·':at+1}</span><span>${t.orderSteps[i]}</span>`,`id="order-${i}" data-value="${i}" aria-pressed="${at>=0}" aria-label="${at<0?'':(at+1)+'. '}${t.orderSteps[i]}"`);}).join('')}</div><p class="order-summary" aria-live="polite">${a.order.length} ${t.orderProgress}</p><div style="margin-top:12px">${button('clear-order',t.orderReset,'id="clear-order"')}</div>`;
}}
function dataTable(){const t=c();return `<table class="data-table"><caption class="sr-only">${t.data}</caption><thead><tr><th scope="col">${t.category}</th><th scope="col">${t.count}</th></tr></thead><tbody>${t.shapes.map((s,i)=>`<tr><th scope="row">${s}</th><td>${targetBars[i]}</td></tr>`).join('')}</tbody></table>`;}
function feedback(){const f=answers[active].feedback;return `<div id="feedback" class="feedback ${f?'':'empty'}" role="status">${f?c()[f]:c().start}</div>`;}
function render(restore=true){const old=restore?document.activeElement?.id:null,t=c(),task=tasks[active],a=answers[active],r=reviews[active];document.documentElement.lang=lang;document.title=lang==='de'?'Lernaufgaben · unabhängiger UI-Entwurf':'Learning tasks · independent UI design';
document.getElementById('app').innerHTML=`<header class="topbar"><div class="wordmark"><span class="mark" aria-hidden="true">↗</span><span>${t.brand}<br><span style="font-size:12px;font-weight:500;color:var(--muted)">${t.lab}</span></span></div><div class="lang" role="group" aria-label="${lang==='de'?'Sprache':'Language'}">${button('language','DE',`id="language-de" lang="de" data-value="de" aria-label="Deutsch" aria-pressed="${lang==='de'}"`)}${button('language','EN',`id="language-en" lang="en" data-value="en" aria-label="English" aria-pressed="${lang==='en'}"`)}</div></header><section class="hero"><div><p class="eyebrow">${t.eyebrow}</p><h1>${t.headline}</h1></div><div class="intro"><p><strong>${t.intro}</strong></p><p>${t.scope}</p></div></section><section class="principle" aria-labelledby="principle-title"><h2 id="principle-title">${t.principleTitle}</h2><div><p>${t.principleText}</p><p class="hint">${t.mediaCaveat}</p></div></section><main class="lab"><nav class="nav" aria-label="${t.forms}"><p class="nav-title">${t.forms}</p>${tasks.map((item,i)=>button('task',`<span class="num">${String(i+1).padStart(2,'0')}</span><span>${tx(item.name)}<small>${tx(item.sub)}</small></span>`,`id="nav-${i}" data-value="${i}" aria-pressed="${i===active}"`)).join('')}</nav><section class="card task" aria-labelledby="task-title"><div class="task-heading"><div class="row"><span class="eyebrow" style="margin:0">${String(active+1).padStart(2,'0')} / ${String(tasks.length).padStart(2,'0')} · ${t.task}</span><span class="badge">${t.fiction}</span></div><h2 id="task-title">${tx(task.title)}</h2><p>${tx(task.prompt)}</p></div>${sheetRoute()}<div class="workspace">${workspace()}</div><div class="task-footer"><div class="toolbar">${button('check',active===9?t.confirmOrder:(active===6||active===7)?t.ready:t.check,`id="check-answer" ${active===6||active===7?'':'class="primary"'}`)}${button('restart',t.restart,'id="restart-task"')}</div>${feedback()}</div></section><aside class="card review" aria-labelledby="review-title"><p class="eyebrow">${t.reviewCaption}</p><h2 id="review-title">${t.review}</h2>${mediaSection(active)}<dl class="facts">${task.facts.map((fact,i)=>`<dt>${t.facts[i]}</dt><dd>${tx(fact)}</dd>`).join('')}</dl>${familySection(active)}<fieldset class="decision"><legend>${t.decision}</legend>${t.decisions.map((label,i)=>`<label><input type="radio" name="decision" value="${i}" ${r.decision===i?'checked':''}>${label}</label>`).join('')}</fieldset><label class="note-label" for="review-note">${t.note}</label><textarea id="review-note" maxlength="4000" aria-describedby="note-hint">${esc(r.note)}</textarea><p class="decision-note" id="note-hint">${t.noteHint}</p></aside></main><footer class="bottom"><div><span class="badge">${t.offline}</span><p style="margin-top:10px">${t.memory}</p></div><div><span id="marked-count" class="status-count">${reviews.filter(v=>v.decision!==null).length} / ${tasks.length} ${t.marked}</span><div class="secondary-tools">${button('paper',paperOpen?t.returnScreen:t.print,'id="toggle-paper" aria-controls="paper" aria-expanded="'+paperOpen+'"')}${button('download',t.download,'id="download-decisions"')}${button('reset-all',t.allReset,'id="reset-all"')}</div><p id="download-status" role="status"></p></div></footer>`;
document.querySelector('.mark').innerHTML='<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 18V6h14M6 17 18 6M11 6h8v8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
renderPaper();bindSurfaces();if(old){document.getElementById(old)?.focus({preventScroll:true});}}
function renderPaper(){const t=c(),task=tasks[active];let content='';switch(active){case 0:content=`<div class="choice-grid">${[3,2,1].map((n,i)=>`<div class="choice">${fraction(n,`${n} ${t.fractionAlt}`)}<span>○ ${t.picture} ${'ABC'[i]}</span></div>`).join('')}</div>`;break;case 1:content=`<div class="equation">24 + 18 = ______</div><p>${t.paperExplain}</p><div class="blank"></div>`;break;case 2:content=`<div class="numberline">${numberSvg()}</div><p class="hint">${t.paperExplain}</p><div class="answer-line"></div>`;break;case 3:content=`<p>${numbers.join(' · ')}</p><p class="hint">${t.paperSort}</p><div class="bins"><div class="bin"><h3>${t.even}</h3><div style="height:140px"></div></div><div class="bin"><h3>${t.odd}</h3><div style="height:140px"></div></div></div>`;break;case 4:content=`<div class="tile-grid">${Array.from({length:8},()=>'<div class="blank-tile"></div>').join('')}</div>`;break;case 5:content=`${dataTable()}<svg viewBox="0 0 600 300" role="img" aria-label="${t.chartAlt}">${[0,1,2,3,4,5,6].map(n=>`<text x="29" y="${257-n*35}" text-anchor="end" font-size="16">${n}</text><line x1="40" x2="575" y1="${250-n*35}" y2="${250-n*35}" stroke="#b9c8be"/>`).join('')}<path d="M40 40V250H575" fill="none" stroke="#263f34" stroke-width="2"/>${t.shapes.map((s,i)=>`<text x="${130+i*180}" y="283" text-anchor="middle" font-size="16">${s}</text>`).join('')}</svg>`;break;case 6:content=`<p class="hint">${t.paperDraw}</p><div class="blank"></div><p>${t.paperExplain}</p><div class="answer-line"></div>`;break;case 7:content=`<p>${t.paperMeasure}</p><p style="margin-top:30px">${t.paperExplain}</p><div class="blank"></div>`;break;case 8:content=`<div class="paper-options">${[640,650,660].map(n=>`<div>○ ${n}</div>`).join('')}</div><p>${t.paperExplain}</p><div class="answer-line"></div>`;break;case 9:content=`<p>${t.orderPaper}</p><div class="paper-options">${orderDisplay.map(i=>`<div>____ &nbsp; ${t.orderSteps[i]}</div>`).join('')}</div>`;break;}
const paper=document.getElementById('paper');paper.className='paper'+(paperOpen?' open':'');paper.innerHTML=`<div class="print-actions"><p class="hint" style="margin:0 0 12px">${t.paperHint}</p><p class="hint" style="margin:0 0 16px">${t.noPrinter}</p>${button('print',t.printNow,'class="primary"')} ${button('paper',t.returnScreen,'id="return-screen"')}</div><p class="print-label">${t.paperLabel}</p><h2 id="paper-title" class="paper-title" tabindex="-1" style="margin-top:15px">${tx(task.title)}</h2><p class="print-instruction">${tx(mediaSets[active].prompt)}</p><p class="paper-material"><strong>${t.materialLabel}:</strong> ${tx(mediaSets[active].material)}</p>${content}`;
}
function clearFeedback(){answers[active].feedback='';const el=document.getElementById('feedback');if(el){el.textContent=c().start;el.classList.add('empty');}}
function showFeedback(key){answers[active].feedback=key;const el=document.getElementById('feedback');el.classList.remove('empty');el.textContent=c()[key];}
function check(){const a=answers[active];switch(active){case 0:showFeedback(a.choice===null?'noChoice':a.choice===0?'good':'fractionHint');break;case 1:showFeedback(!a.number.trim()?'numberEmpty':!/^\d{1,3}$/.test(a.number)?'digits':Number(a.number)===42?'good':'numberHint');break;case 2:showFeedback(a.line===null?'lineEmpty':a.line===6?'good':'lineHint');break;case 3:showFeedback(numbers.some(n=>a.sort[n]===undefined)?'sortEmpty':numbers.every(n=>a.sort[n]===(n%2?'odd':'even'))?'good':'sortHint');break;case 4:showFeedback(a.tiles.filter(Boolean).length===3?'good':'colorHint');break;case 5:showFeedback(a.bars.every((v,i)=>v===targetBars[i])?'good':'chartHint');break;case 6:showFeedback(a.strokes.length||a.drawingText.trim()?'drawingFeedback':'drawingEmpty');break;case 7:showFeedback(a.measurement.trim()||a.explanation.trim()?'humanFeedback':'humanEmpty');break;case 8:showFeedback(a.textChoice===null?'textEmpty':a.textChoice===650?'good':'textHint');break;case 9:showFeedback(a.order.length!==4?'orderEmpty':a.order.every((v,i)=>v===i)?'good':'orderHint');break;}}
function lineSet(v){clearFeedback();answers[active].line=Math.max(0,Math.min(8,v));render();}
function addPoint(){const a=answers[active];clearFeedback();if(!a.kbdLine){a.strokes.push([]);a.kbdLine=true;}a.strokes.at(-1).push({...a.cursor});render();}
function download(){const t=c();const lines=[t.exportTitle,t.exportScope,t.sourceTitle,t.sourceNote,'',...tasks.flatMap((task,i)=>[`${String(i+1).padStart(2,'0')} · ${tx(task.name)}`,`${t.decision}: ${reviews[i].decision===null?t.unset:t.decisions[reviews[i].decision]}`,`${t.exportNote}: ${reviews[i].note||t.exportEmpty}`,...task.facts.map((fact,j)=>`${t.facts[j]} ${tx(fact)}`),...familyExport(i),...mediaExport(i),''])];const blob=new Blob(['\uFEFF'+lines.join('\n')],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=`lernaufgaben-ui-entscheidungen-${lang}.txt`;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);document.getElementById('download-status').textContent=t.downloaded;}
document.addEventListener('click',event=>{const b=event.target.closest('button[data-action]');if(!b||b.disabled)return;const a=answers[active],v=b.dataset.value;switch(b.dataset.action){
case 'language':lang=v;render();break;
case 'task':active=Number(v);render();break;
case 'choice':clearFeedback();a.choice=Number(v);render();break;
case 'text-choice':clearFeedback();a.textChoice=Number(v);render();break;
case 'order-choice':{clearFeedback();const n=Number(v),at=a.order.indexOf(n);if(at>=0)a.order=a.order.slice(0,at);else a.order.push(n);render();break;}
case 'clear-order':clearFeedback();a.order=[];render();break;
case 'key':clearFeedback();a.number=v==='clear'?'':v==='erase'?a.number.slice(0,-1):(a.number+v).slice(0,3);render();break;
case 'line-step':lineSet((a.line??0)+Number(v));break;
case 'select-number':a.selected=a.selected===Number(v)?null:Number(v);render();break;
case 'assign':if(a.selected!==null){clearFeedback();const n=a.selected;if(v==='return')delete a.sort[n];else a.sort[n]=v;a.selected=null;render();document.getElementById('chip-'+n)?.focus({preventScroll:true});}break;
case 'tile':clearFeedback();a.tiles[Number(v)]=!a.tiles[Number(v)];render();break;
case 'bar':{clearFeedback();const i=Number(b.dataset.index);a.bars[i]=Math.max(0,Math.min(6,a.bars[i]+Number(v)));render();if(a.bars[i]===0||a.bars[i]===6)document.getElementById(`bar-${i}-${a.bars[i]===0?'plus':'minus'}`)?.focus({preventScroll:true});break;}
case 'add-point':addPoint();break;
case 'end-line':a.kbdLine=false;render();break;
case 'undo':clearFeedback();a.strokes.pop();a.kbdLine=false;render();if(!a.strokes.length)document.getElementById('drawing-surface')?.focus({preventScroll:true});break;
case 'clear-drawing':clearFeedback();a.strokes=[];a.kbdLine=false;render();break;
case 'check':check();break;
case 'restart':answers[active]=fresh();render();break;
case 'reset-all':answers=tasks.map(fresh);reviews=tasks.map(()=>({decision:null,note:''}));render();break;
case 'paper':switchPaper(!paperOpen);break;
case 'open-sheet':switchPaper(true);break;
case 'print':window.print();break;
case 'download':download();break;
}});
document.addEventListener('input',e=>{const a=answers[active];switch(e.target.id){case 'number-answer':a.number=e.target.value;clearFeedback();break;case 'review-note':reviews[active].note=e.target.value;break;case 'drawing-text':a.drawingText=e.target.value;clearFeedback();break;case 'measurement':a.measurement=e.target.value;clearFeedback();break;case 'explanation':a.explanation=e.target.value;clearFeedback();break;}});
document.addEventListener('change',e=>{if(e.target.name==='decision'){reviews[active].decision=Number(e.target.value);document.getElementById('marked-count').textContent=`${reviews.filter(v=>v.decision!==null).length} / ${tasks.length} ${c().marked}`;}});
document.addEventListener('keydown',e=>{if(e.target.id==='number-answer'&&e.key==='Enter'){e.preventDefault();check();}});
function svgPoint(svg,event){const p=svg.createSVGPoint();p.x=event.clientX;p.y=event.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
function bindSurfaces(){const line=document.getElementById('number-line');if(line){line.addEventListener('click',e=>{const p=svgPoint(line.querySelector('svg'),e);lineSet(Math.round((p.x-45)/63.75));});line.addEventListener('keydown',e=>{let v=answers[active].line??0;if(['ArrowRight','ArrowUp'].includes(e.key))v++;else if(['ArrowLeft','ArrowDown'].includes(e.key))v--;else if(e.key==='Home')v=0;else if(e.key==='End')v=8;else return;e.preventDefault();lineSet(v);});}
const draw=document.getElementById('drawing-surface');if(!draw)return;let drawing=false;const point=e=>{const p=svgPoint(draw.querySelector('svg'),e);return {x:Math.round(Math.max(5,Math.min(595,p.x))),y:Math.round(Math.max(5,Math.min(275,p.y)))};};const paint=()=>{draw.innerHTML=drawingSvg();};
draw.addEventListener('pointerdown',e=>{if(e.button!==0)return;e.preventDefault();draw.focus({preventScroll:true});draw.setPointerCapture(e.pointerId);drawing=true;const a=answers[active];a.kbdLine=false;clearFeedback();a.strokes.push([point(e)]);paint();});
draw.addEventListener('pointermove',e=>{if(!drawing)return;const stroke=answers[active].strokes.at(-1),p=point(e),last=stroke.at(-1);if(Math.hypot(p.x-last.x,p.y-last.y)>2){stroke.push(p);paint();}});
const end=()=>{if(!drawing)return;drawing=false;const undo=document.getElementById('undo');if(undo)undo.disabled=false;};draw.addEventListener('pointerup',end);draw.addEventListener('pointercancel',end);draw.addEventListener('lostpointercapture',end);
draw.addEventListener('keydown',e=>{const a=answers[active],step=e.shiftKey?5:30;let moved=true;if(e.key==='ArrowLeft')a.cursor.x-=step;else if(e.key==='ArrowRight')a.cursor.x+=step;else if(e.key==='ArrowUp')a.cursor.y-=step;else if(e.key==='ArrowDown')a.cursor.y+=step;else moved=false;if(moved){e.preventDefault();a.cursor.x=Math.max(15,Math.min(585,a.cursor.x));a.cursor.y=Math.max(14,Math.min(266,a.cursor.y));paint();}else if(e.key===' '){e.preventDefault();addPoint();}else if(e.key==='Enter'){e.preventDefault();a.kbdLine=false;}else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();a.strokes.pop();a.kbdLine=false;render();}});
}
window.addEventListener('beforeprint',renderPaper);
render(false);
</script>
</body>
</html>
