name: Big Quest AI gateway security
on:
  pull_request:
    paths:
      - 'server/claude-evaluation-gateway.mjs'
      - 'server/parent-session-verifier.mjs'
      - 'tests/claude-evaluation-gateway.test.mjs'
      - 'tests/parent-session-verifier.test.mjs'
      - '.github/workflows/ai-gateway-security.yml'
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify fail-closed identity, privacy, quota and Anthropic isolation
        run: node --test tests/claude-evaluation-gateway.test.mjs tests/parent-session-verifier.test.mjs
