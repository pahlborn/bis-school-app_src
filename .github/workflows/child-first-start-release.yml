name: Verify child first start release
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/child-first-start-release.yml'
      - 'index.html'
      - 'package.json'
      - 'src/module/**'
      - 'tests/**'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      TEST_SHARD: ${{ matrix.shard }}/6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock
      - run: npx playwright install chromium --only-shell
      - name: Run shard of the complete test suite
        run: |
          node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs'
          import { execSync } from 'node:child_process'
          const { scripts } = JSON.parse(readFileSync('package.json','utf8'))
          const shard = process.env.TEST_SHARD
          if (!/^[1-6]\/6$/.test(shard) || !scripts.test.startsWith('node --test ')) process.exit(1)
          const command = scripts.test.replace('node --test --test-concurrency=7 ', `node --test --test-concurrency=3 --test-shard=${shard} `)
          if (command === scripts.test) process.exit(1)
          execSync(command,{stdio:'inherit'})
          NODE
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build versioned test instance
        run: node werkzeug/testinstanz.mjs
      - name: Check artifact version against source and commit
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs'
          import { versionAuslesen, versionErmitteln, versionQuelleGleich } from './werkzeug/version.mjs'
          const actual = versionAuslesen(fs.readFileSync('dist-test/index.html','utf8'))
          const expected = versionErmitteln(process.cwd())
          if (!actual || !versionQuelleGleich(actual,expected) || actual.draft) {
            console.error('Test artifact version does not match package.json and checked-out commit.')
            process.exit(1)
          }
          console.log('Validated:', actual.major+'.'+actual.minor+'.'+actual.patch, actual.kanal, actual.hash, actual.date)
          NODE
          echo "BQ_ARTIFACT=big-quest-test-$(node -p "require('./package.json').version")-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BQ_ARTIFACT }}
          path: dist-test/
