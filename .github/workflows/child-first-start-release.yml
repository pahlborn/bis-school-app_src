name: Verify child first start release
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/child-first-start-release.yml'
      - 'index.html'
      - 'package.json'
      - 'src/module/**'
      - 'tests/**'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock
      - run: npm test
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node werkzeug/testinstanz.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: big-quest-test-0.152.2
          path: dist-test/
