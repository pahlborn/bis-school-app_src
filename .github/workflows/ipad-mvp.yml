name: Big Quest iPad build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ios/**'
      - 'tests/ios-keychain-diagnostics.swift'
      - '.github/workflows/ipad-mvp.yml'

permissions:
  contents: read

concurrency:
  group: ipad-mvp-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build iPad app for the simulator
        run: >-
          xcodebuild -project ios/BigQuestMVP.xcodeproj
          -scheme BigQuestMVP
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
      - name: Deterministic Keychain diagnostics regression (synthetic storage)
        run: |
          swiftc -parse-as-library ios/BigQuestMVP/ClaudeClient.swift tests/ios-keychain-diagnostics.swift -o /tmp/bq-keychain-diagnostics
          /tmp/bq-keychain-diagnostics
